deep:[{name:"DRM — Widevine / FairPlay / PlayReady",diag:`PROBLEM: every premium stream must be license-protected
  Multiple DRM systems exist because device vendors require different ones:
    Widevine    — Chrome, Android, most Smart TVs
    FairPlay    — Safari, iOS, Apple TV
    PlayReady   — Edge, Xbox, Windows
  Each is a closed-source license-server + player-side decryptor

PLAYBACK FLOW:
  1. Player requests /playback → server returns:
       manifest_url + license_url + short-lived token
  2. Player fetches manifest → segments encrypted with content key
  3. Player asks DRM license server (with token + device cert):
       "give me license to decrypt this content"
  4. License server validates: subscription tier, region, simultaneous streams
       returns license bound to this device (TEE-protected)
  5. Player decrypts segments inside TEE; pixels never leave DRM-protected path

KEY DECISIONS:
  Pre-encrypt each variant with a per-title content key (offline)
  Same encrypted bytes served by CDN to all viewers (cacheable!)
  Per-viewer differentiation only in the license, not the bytes
  Per-region license rules enforced at license server (cheap to revoke)`,pts:["Encrypted bytes are cacheable (same for everyone) — license is per-user","License server is the policy enforcement point, not the CDN","Offline downloads = license with limited expiry (e.g. 72h)","Simultaneous streams cap enforced at license server, not the player"]},{name:"CDN at planetary scale — Open Connect / multi-CDN",diag:`100 Tbps peak cannot come from any single commercial CDN
  Netflix solved this with Open Connect: purpose-built caches embedded inside ISPs
  (Akamai/Cloudflare typically reach ~hundreds of Tbps; OC tops 200+)

OPEN CONNECT MODEL:
  1. Netflix ships dedicated rack appliances to each ISP
  2. ISP plugs them into their network (peering)
  3. Catalogue (~150 TB master assets, but most viewing is concentrated)
     pre-pushed to each box during off-peak (3am-6am local)
  4. ISP's customers stream from the box on the ISP's own network
     → ISP saves transit costs; users get LAN-fast streaming

PRE-WARMING:
  Before a major release: push the title to every OC box ahead of time
  After release: ~99% of bytes served from local box → ~0 inter-ISP cost

WHY THIS WINS:
  Centralised CDN cost: $X per GB egress × 180 PB/day = ruinous
  Open Connect: capex per box, but op-ex ~0 once placed
  Disney+/Amazon use similar embedded-cache strategies
  Smaller services use multi-CDN (Akamai + Cloudflare + Fastly) routed by RUM`,pts:["Concentrated viewing (50M on one finale) makes pre-warming effective","ISP-embedded boxes flip CDN cost from ongoing egress to one-time hardware","Multi-CDN routing via RUM picks the best CDN per user per moment","Static segments cached for hours; manifests refreshed every few seconds"]},{name:"Adaptive Bitrate (HLS / DASH)",diag:`ONE master file → encoded into a "bitrate ladder":
  240p @ 400 kbps, 360p @ 800k, 480p @ 1.5M, 720p @ 3M, 1080p @ 6M, 4K @ 15M

PACKAGING:
  Each variant chunked into ~6s segments
  Manifest file lists all variants + segment URLs
  Player reads manifest, picks variant based on:
    measured network throughput, buffer level, screen size, CPU

ADAPTATION LOGIC (player-side):
  Maintain ~30s of buffered video ahead
  If throughput drops → switch to lower bitrate on next segment boundary
  If throughput stable + buffer healthy → step up one rung
  Two algorithms in use industry-wide:
    ABR  — throughput-based
    BOLA — buffer-based (Netflix's choice)
    MPC  — model-predictive (combines both)

SERVER SIDE:
  Identical segments cached by CDN regardless of viewer
  Manifest tweaks per device (mobile gets ladder without 4K)
  Per-CDN edge can pre-decrypt manifest URLs (signed)`,pts:["Segments are static + cacheable — players choose dynamically","BOLA outperforms simple throughput ABR in real networks","ABR ladder is per-title (action movie needs more bitrate than animation)","Server never re-encodes per request — all variants pre-built"]}],
xq:[{q:"Why not just one CDN like Cloudflare?",a:"At 100 Tbps peak, no single commercial CDN can serve everything affordably. Netflix built Open Connect: dedicated cache appliances inside ISPs, pre-warmed with the catalogue. ~99% of bytes get served from a box on the ISP's own LAN — bandwidth costs collapse from per-GB egress to one-time hardware. Disney+/Amazon use embedded-cache variants; smaller services use multi-CDN routed by Real-User-Measurement signals (latency, error rate).",pb:true},{q:"How is DRM different from regular HTTPS?",a:"HTTPS protects the bytes in transit; DRM protects them at rest and during playback inside the device. With DRM (Widevine/FairPlay/PlayReady): segments encrypted at packaging time with a content key. The decryption key is delivered separately as a 'license' bound to a specific device (using device certificate + TEE/Secure Enclave). Decoded pixels never leave the protected video path — they can't be screenshot or screen-recorded on a compliant device. The license enforces per-region rules and simultaneous-stream caps. Encrypted bytes are identical for all viewers (cacheable on CDN); only the license is per-user."},{q:"How do you keep watch-resume in sync across devices?",a:"Player sends a heartbeat every ~30s: { profile_id, title_id, position_s, device_id }. Heartbeats → Kafka (~1.7M/s peak) → consumer writes to Cassandra partitioned by profile_id (cross-device resume queries are single-partition). Reads on session start: GET watch_state for this profile → home screen 'Continue Watching' row + Player jumps to position. Conflict resolution: server keeps max(position) per (profile, title) — last-writer-wins biased toward forward progress."},{q:"How does the 4 simultaneous streams cap actually work?",a:"License server tracks active leases per account. When a player starts: requests a license → license server checks active license count for that account → if &lt; tier limit, issue license with TTL (e.g. 5 min, refreshed via heartbeats). When player stops cleanly: release license. If player crashes: TTL expires naturally; slot frees up. Race condition (two clients start simultaneously at the limit): license server uses Redis WATCH+MULTI or CAS to make 'check + grant' atomic. The CDN doesn't enforce this — segments are cached and cheap; only the license server gatekeeps."},{q:"Why pre-encrypt the same bytes for every viewer instead of per-user?",a:"Per-user encryption would mean the CDN can't cache — every viewer fetches different bytes from origin. Catastrophic at 100 Tbps. Industry standard: encrypt each variant once per title (per DRM scheme) at packaging time; same bytes served to all viewers; differentiation is purely in the per-user license. Forensic watermarking exists for piracy investigation but applies subtle per-session perturbation that doesn't break caching."}]}
];

const PROBLEMS = [...P, ...P2, ...P3];

// ─── RENDER ENGINE ─────────────────────────────────────────────────────
let currentProblem = PROBLEMS[0];
let currentPhase = 'req';

function init() {
  // Build problem selector
  const psel = document.getElementById('psel');
  PROBLEMS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pp' + (i === 0 ? ' on' : '');
    const diff = p.diff === 'hard' ? '🔴' : p.diff === 'med' ? '🟡' : '🟢';
    btn.textContent = diff + ' ' + p.id + '. ' + p.short;
    btn.onclick = () => selectProblem(p, btn);
    psel.appendChild(btn);
  });
  renderPhase();
}

function selectProblem(p, btn) {
  document.querySelectorAll('.pp').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentProblem = p;
  renderPhase();
  window.scrollTo(0, 0);
}

function selectPhase(phase, btn) {
  document.querySelectorAll('.pt').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentPhase = phase;
  renderPhase();
  window.scrollTo(0, 0);
}

document.querySelectorAll('.pt').forEach(btn => {
  btn.onclick = () => selectPhase(btn.dataset.phase, btn);
});

function renderPhase() {
  const c = document.getElementById('content');
  const p = currentProblem;
  const phase = currentPhase;
  let html = '';
  const title = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <span style="font-size:15px;font-weight:800;color:var(--tx)">${p.id}. ${p.name}</span>
    <span class="pill ${p.diff==='hard'?'r':p.diff==='med'?'o':''}">${p.diff.toUpperCase()}</span>
  </div>`;

  if (phase === 'req') {
    html = title;
    html += '<div class="sec-title">Functional Requirements</div>';
    html += '<ul class="rlist">' + p.req.fn.map(r => `<li>${r}</li>`).join('') + '</ul>';
    html += '<div class="sec-title">Non-Functional Requirements</div>';
    html += '<ul class="rlist nfn">' + p.req.nfn.map(r => `<li>${r}</li>`).join('') + '</ul>';
    html += '<div class="sec-title">Clarifying Questions to Ask</div>';
    html += '<ul class="rlist ask">' + p.req.ask.map(r => `<li>${r}</li>`).join('') + '</ul>';
  }
  else if (phase === 'est') {
    html = title;
    html += '<div class="sec-title">Capacity Estimation</div>';
    html += '<div class="est-wrap"><table class="est"><tr><th>Metric</th><th>Formula</th><th>Value</th><th>Decision it drives</th></tr>';
    html += p.est.map(e => `<tr><td>${e.m}</td><td><code>${e.f}</code></td><td class="v">${e.v}</td><td class="d">${e.d}</td></tr>`).join('');
    html += '</table></div>';
    html += '<div class="hbox" style="margin-top:12px"><strong>Rule of thumb (1 day ≈ 10⁵ sec):</strong> 1M/day ≈ 10 QPS &nbsp;|&nbsp; 100M/day ≈ 1k QPS &nbsp;|&nbsp; 1B/day ≈ 10k QPS &nbsp;|&nbsp; 10B/day ≈ 100k QPS</div>';
  }
  else if (phase === 'model') {
    html = title;
    html += '<div class="sec-title">Data Model / Entities</div>';
    html += p.model.map(m => `
      <div class="entity">
        <div class="entity-name">${m.name}</div>
        <div class="entity-body">
          ${m.fields.map(f => `<div class="field-row"><span class="field-name">${f[0]}</span><span class="field-type">${f[1]}</span></div>`).join('')}
          ${m.idx && m.idx.length ? '<div class="idx-row">📌 ' + m.idx.join('<br>📌 ') + '</div>' : ''}
        </div>
      </div>`).join('');
  }
  else if (phase === 'api') {
    html = title;
    html += '<div class="sec-title">API Design</div>';
    html += p.apis.map(a => `
      <div class="api-card">
        <div class="api-header">
          <span class="method m-${a.m.toLowerCase()}">${a.m}</span>
          <span class="api-path">${a.p}</span>
          <span class="api-desc">${a.auth ? '🔐 ' + a.auth : '🔓 Public'}</span>
        </div>
        <div class="api-body">
          <div class="api-label">Description</div>
          <div style="font-size:13px;color:var(--t3);margin-bottom:8px">${a.desc}</div>
          <div class="api-label">Request Body</div>
          <div class="api-code">${a.req}</div>
          <div class="api-label">Response</div>
          <div class="api-code">${a.res}</div>
          <div class="api-label">Status Codes</div>
          <div class="api-codes">${a.codes.split('|').map(c=>c.trim()).map(c=>`<span>${c}</span>`).join('')}</div>
        </div>
      </div>`).join('');
  }
  else if (phase === 'hld') {
    html = title;
    html += '<div class="sec-title">High-Level Design</div>';
    html += `<div class="hld-box">${escHtml(p.hld)}</div>`;
    // Why These Choices — keep alongside HLD since it defends each component
    if (p.hldWhy && p.hldWhy.length) {
      html += '<div class="sub-title">🔧 Why These Choices</div>';
      html += '<div class="why-list">';
      html += p.hldWhy.map(w => `<div class="why-row"><span class="why-c">${w[0]}</span><span class="why-txt">${w[1]}</span></div>`).join('');
      html += '</div>';
    }
  }
  else if (phase === 'deep') {
    html = title;
    html += '<div class="sec-title">Deep Dives — tap to expand each component</div>';
    html += p.deep.map((d, i) => `
      <div class="deep-card" id="dc_${p.id}_${i}">
        <div class="deep-header" onclick="toggleDeep('dc_${p.id}_${i}')">
          <span class="deep-title">🔍 ${d.name}</span>
          <span class="deep-chev">▼</span>
        </div>
        <div class="deep-body">
          <div class="deep-diag">${escHtml(d.diag)}</div>
          <ul class="deep-pts">${d.pts.map(pt => `<li>${pt}</li>`).join('')}</ul>
        </div>
      </div>`).join('');
  }
  else if (phase === 'xq') {
    html = title;
    html += '<div class="sec-title">Expected Interview Cross-Questions — tap to reveal answer</div>';
    html += p.xq.map((q, i) => `
      <div class="xq-item${q.pb?' pushback':''}" id="xq_${p.id}_${i}" onclick="toggleXQ('xq_${p.id}_${i}')">
        <div class="xq-q">
          <span class="xq-qtag">${q.pb ? '⚡ PUSHBACK' : 'Q'}</span>
          ${q.q}
        </div>
        <div class="xq-a">${q.a}</div>
      </div>`).join('');
  }

  c.innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toggleDeep(id) { document.getElementById(id).classList.toggle('open'); }
function toggleXQ(id) { document.getElementById(id).classList.toggle('open'); }

init();
</script>
</body>
</html>
