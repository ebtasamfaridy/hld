deep:[{name:"Idempotent Billing: No Double Charge",diag:`Scenario: billing worker sends charge → network timeout
  Worker retries → without idempotency → DOUBLE CHARGE!

Solution: deterministic idempotency key:
  key = SHA256(sub_id + period_start_date + attempt_number)
  
  Same key submitted to Stripe/Razorpay → payment gateway
  returns CACHED result of first successful charge
  No duplicate charge processed

Worker flow:
  1. Generate idempotency_key (deterministic formula above)
  2. INSERT invoice (status=DRAFT, idempotency_key) [PostgreSQL]
  3. Call payment gateway API with idempotency_key header
  4. Gateway: first call → process charge, cache result 24h
              subsequent calls with same key → return cached result
  5. UPDATE invoice status=PAID/FAILED

Belt-and-suspenders:
  PostgreSQL UNIQUE INDEX on invoice.idempotency_key
  → even if code bug runs billing twice, DB rejects second INSERT
  → 4-layer protection: lock + idem key + gateway caching + DB unique`,pts:["SHA256 key is deterministic — same billing event always generates same key","24h idempotency window covers any reasonable retry scenario","SETNX lock prevents two workers billing same subscription simultaneously","Test: simulate gateway timeout → verify no double charge in invoice table"]},{name:"Proration on Mid-Cycle Plan Change",diag:`User on Basic ($10/mo), upgrades to Pro ($30/mo) on Day 15 of 30:

  Unused Basic credit:
    = $10 × (15 remaining days / 30 total days)
    = $10 × 0.5 = $5.00

  Pro charge for remaining 15 days:
    = $30 × (15 / 30)
    = $30 × 0.5 = $15.00

  Net charge immediately: $15.00 - $5.00 = $10.00
  (Stripe handles this automatically with proration_behavior='create_prorations')

  Next cycle (full month): $30.00

  Implementation:
    1. Calculate proration on plan change request
    2. Show user the $10 charge BEFORE confirming
    3. If user confirms:
       - Create prorated invoice (amount=$10.00)
       - Charge immediately
       - UPDATE subscription plan_id, leave period dates unchanged
    4. Next renewal: full new plan price`,pts:["Always show user the proration amount before charging — no surprises","Store line_items in invoice JSONB: [{desc:'Unused Basic credit',-5.00},{desc:'Pro (15 days)',15.00}]","Proration is calculated on the billing service side, not Stripe's side (for visibility)","For annual ↔ monthly switch: more complex — convert daily rates"]}],
xq:[{q:"How do you handle the month-end billing spike (10M subscriptions renewing)?",a:"Natural spreading: subscriptions created on any day have their renewal on that same date each month — only ~1/30th renew on the 1st. For those that do cluster: Kafka acts as the buffer. Billing Scheduler publishes to Kafka at renewal time, workers consume at sustainable rate. Auto-scale workers based on Kafka consumer lag (KEDA). Redis SETNX lock ensures no double-billing during scale-out."},{q:"What if the payment gateway is down during billing?",a:"Worker retries with exponential backoff (immediate → 5min → 30min → 2h). Kafka consumer doesn't commit offset until processing succeeds → message retained for retry. If gateway is down >24h: escalate to ops team, pause billing batch, notify customers proactively. Recovery: resume processing from Kafka offset → all retries use same idempotency_key → no double charges.",pb:true},{q:"How do you accurately calculate MRR with plan changes?",a:"MRR = sum of all active subscription amounts normalized to monthly. Annual plan ($120/yr) → MRR contribution = $10/mo. On plan change: remove old plan contribution, add new plan contribution from change date. Use event sourcing: log every subscription state change → MRR is a reduction over all active subscription events. Compute nightly via Spark job, cache in PostgreSQL analytical table."}]},

hld:`TAG WRITE PATH:
  Client → Tagging API
    1. Normalize tag: lowercase, trim, slug
    2. Resolve alias: "js" → tag_id of "javascript"
       (Redis HGET aliases:{tenant_id} js)
    3. BATCH INSERT to Cassandra (atomic):
       INSERT INTO entity_tags (entity_id, tag_id, ...)
       INSERT INTO tag_entities (tag_id, entity_id, ...)
    4. Redis HINCRBY tenant:{id}:tag_counts {tag_id} 1
    5. Kafka "tag-events" → Elasticsearch, trending

TAG SEARCH (READ PATH):
  GET /tags/{name}/entities
    1. Resolve tag_name → tag_id via Redis or MySQL
    2. Redis: GET tag:{id}:entities:{tenant} (5min TTL)
    3. Cache MISS → Cassandra:
       SELECT entity_id FROM tag_entities
       WHERE tag_id=? AND tenant_id=?
       [token-based cursor pagination]
    4. Cache result, return

BOOLEAN SEARCH (AND/OR):
  Simple AND (tag A AND tag B):
    Fetch entity lists for A and B from Cassandra
    Intersect sorted lists (merge join, O(N+M))

deep:[{name:"Dual Cassandra Table: The Key Design Decision",diag:`WHY TWO TABLES?
  One question → one Cassandra table (partition key lookup)
  Two questions → two tables (denormalize)

Question 1: "What tags does entity POST-123 have?"
  Table: entity_tags, partition by entity_id
  SELECT * FROM entity_tags WHERE entity_id='POST-123'
  → All tags for this entity, O(1) partition lookup

Question 2: "What entities are tagged with 'javascript'?"
  Table: tag_entities, partition by tag_id
  SELECT * FROM tag_entities WHERE tag_id='js-uuid'
  → All entities with this tag, O(1) partition lookup

What about MySQL JOIN?
  SELECT entity_id FROM entity_tags WHERE tag_id=?
  MySQL: fine for small datasets, but 100K writes/s and
  500K reads/s would overwhelm MySQL.
  Cassandra handles these naturally at scale.

Write amplification:
  Every tag operation writes to BOTH tables
  This is intentional — we pay extra storage/write cost
  to buy fast O(1) reads in both directions`,pts:["Cassandra shines when you know your access patterns upfront","Never use ALLOW FILTERING in Cassandra — full cluster scan","Always design the tables around the queries, not the relationships","Dual-table is the Cassandra equivalent of a database JOIN"]},{name:"Multi-Tenant Tag Isolation",diag:`PROBLEM: Tenant A should not see Tenant B's tags

SOLUTION: tenant_id in every partition key

Cassandra partition key: (tag_id, tenant_id)
  → Physical data separation at storage level
  → tag_id='{javascript}' for tenant_A != tenant_B
  → No cross-tenant data leakage possible at DB level

Application-layer enforcement:
  All API calls authenticated via JWT
  JWT payload: { user_id, tenant_id }
  Tagging API ALWAYS uses tenant_id from JWT
  Client-provided tenant_id is IGNORED and overridden

Redis namespace:
  tenant:{tenant_id}:tag_counts → tenant-specific counts
  NOT tag_counts globally

Elasticsearch index:
  Either: separate index per tenant
  Or: single index with tenant_id field + mandatory filter
  Recommendation: single index + filter for < 100 tenants
                  separate index per tenant for > 100 tenants`,pts:["Never trust client-provided tenant_id — always use JWT claim","Test with dual-tenant load to verify isolation (CRITICAL)","Cassandra composite partition: (tenant_id, tag_id) is even better","Row-level security in PostgreSQL as alternative for smaller scale"]}],
xq:[{q:"How do you handle tag deletion when a popular tag has millions of entities?",a:"Never delete synchronously — too expensive. Phase 1: soft delete (mark tag as BLOCKED/DELETED in MySQL → removed from autocomplete/search/new tagging instantly). Phase 2: async cleanup via Kafka. 'tag-deleted' event triggers background workers that paginate through tag_entities table (CURSOR pagination) and delete in batches of 1000. Eventually consistent deletion — acceptable since soft delete already hides the tag from users."},{q:"How do you implement related tags ('also used with')?",a:"Offline Spark job runs daily on the full tag-entity dataset. For each pair of tags (A, B) that co-occur on the same entity, count occurrences. Store top-20 co-occurring tags per tag in Redis ZADD: ZADD tag:{id}:related {co_count} {related_tag_id}. Read with ZREVRANGE tag:{id}:related 0 19. Minimum threshold (50+ co-occurrences) prevents noise from rare combinations. Rebuilt daily.",pb:true},{q:"How does tag autocomplete work?",a:"Same infrastructure as Search Autocomplete (Problem 11) but scoped per tenant. Separate small trie (10K top tags per tenant) loaded in-memory. Redis cache: GET ac:{tenant}:{prefix} (5min TTL). Popularity sorted by usage_count (from Redis HINCRBY counters). Rebuild trie every 10 minutes from Redis tag counts + MySQL tag names."}]},

hld:`┌──────────────────────────────────────────────────────────────┐
│  Clients (Multiple Tenants) → Job Submission API             │
│    → INSERT into PostgreSQL jobs + job_steps                  │
│    → next_run_at = cronLib.next(expr, NOW(), timezone)        │
│    → Partial index picks up new PENDING row automatically     │
└───────────────────────────────┬──────────────────────────────┘
                                │
┌───────────────────────────────▼──────────────────────────────┐
│  Scheduler (Leader, runs every 5 seconds)                    │
│                                                              │
│  Leader election: SETNX scheduler:leader {node_id} EX 30    │
│                                                              │
│  SELECT job_id FROM jobs                                     │
│  WHERE status='PENDING' AND next_run_at <= NOW()+30s         │
│  ORDER BY next_run_at ASC LIMIT 500                          │
│  FOR UPDATE SKIP LOCKED    ← CRITICAL: atomic multi-worker   │
│                                                              │
│  → UPDATE status='QUEUED'                                    │
│  → Publish job_ids to Kafka "jobs-due"                       │
└───────────────────────────────┬──────────────────────────────┘
                                │
┌───────────────────────────────▼──────────────────────────────┐
│  Worker Fleet (auto-scaled, stateless)                       │
│                                                              │
│  For each job received:                                      │
│    LOOP:                                                     │
│      step = SELECT FROM job_steps                            │
│             WHERE job_id=? AND status!='COMPLETED'           │
│             ORDER BY step_index ASC LIMIT 1                  │
│      IF no step: job DONE → UPDATE status='COMPLETED'        │
│                  BREAK                                       │
│      Mark step RUNNING                                       │
│      Execute step (HTTP/Lambda/Queue)                        │
│        SUCCESS: step→COMPLETED, store output, CONTINUE LOOP  │
│        FAILURE: retry (backoff) → if exhausted: FAILED BREAK │
│                                                              │
│  For CRON jobs on completion:                                │
│    BEGIN TRANSACTION:                                        │
│      UPDATE jobs SET status='PENDING',                       │
│        next_run_at = cronLib.next(expr, from=LAST_RUN_AT),   │
│        current_step=0                                        │
│      UPDATE job_steps SET status='PENDING', output=NULL      │
│    COMMIT                                                    │
└──────────────────────────────────────────────────────────────┘`,

deep:[{name:"PostgreSQL: Why It's Right (and Cassandra is Wrong)",diag:`INTERVIEW PUSHBACK: "PostgreSQL can't handle the writes"

QUANTIFY FIRST:
  116 jobs complete/sec × 6 rows = 700 writes/sec
  PostgreSQL handles 5,000-10,000 writes/sec comfortably
  700/sec = 10% utilisation → NOT a concern!

WHY POSTGRESQL (not Cassandra):
  1. ACID multi-table transaction:
     BEGIN;
       UPDATE jobs SET status='RUNNING' WHERE job_id=?;
       UPDATE job_steps SET status='RUNNING' WHERE step_id=?;
     COMMIT;
     ← If crash between these: ROLLBACK. Consistent state guaranteed.
     Cassandra: cannot update two tables atomically → silent corruption

  2. SELECT FOR UPDATE SKIP LOCKED:
     50 workers claim different jobs simultaneously
     No external Redis lock needed for job claiming
     Cassandra: no equivalent → need Redis locks → more complexity

  3. Partial Index (the killer feature):
     CREATE INDEX ON jobs(next_run_at) WHERE status='PENDING'
     Only ~3,500 rows indexed (not 100M)
     Index = 70KB, fits in L1 cache
     Query: O(12) B-tree comparisons regardless of 100M total rows

  4. Complex queries:
     WHERE status='PENDING' AND next_run_at <= NOW() + INTERVAL '30s'
     ORDER BY next_run_at
     Cassandra: status isn't partition key → full cluster scan`,pts:["Never switch DB without running the numbers first","Cassandra loses ACID that's critical for job state correctness","Partial index is why 100M rows doesn't mean 100M rows scanned","PgBouncer connection pooling handles 10K+ concurrent workers"]},{name:"next_run_at: Who Calculates It and When",diag:`MOMENT 1: Job Creation (API Server)
  Client sends: { cron_expr: "0 9 * * MON-FRI", timezone: "Asia/Kolkata" }
  API: next_run_at = cronLib.next("0 9 * * MON-FRI", from=NOW(), tz="Asia/Kolkata")
  → "2026-05-18T09:00:00+05:30" (next Monday 9am)
  Stored as UTC: "2026-05-18T03:30:00Z"

MOMENT 2: After Each Execution (Worker)
  Worker completes ALL steps → last step marked COMPLETED
  
  CRITICAL: use from=LAST_RUN_AT not from=NOW()!
  
  If from=NOW():   job ran 2min late → next schedule drifts to 9:02am
                   → next run drifts to 9:04am → accumulates over time
  If from=LAST_RUN_AT: next = "2026-05-25T09:00:00+05:30" regardless of actual run time
                        → no drift ever
  
  Atomic transaction (worker commits all at once):
  BEGIN;
    UPDATE jobs SET
      status = 'PENDING',
      next_run_at = cronLib.next(cron_expr, from=last_run_at, tz=timezone),
      current_step = 0,
      retry_count = 0;
    UPDATE job_steps SET status='PENDING', output=NULL
      WHERE job_id = ?;
  COMMIT;  ← Atomic: if crash before commit → job stays FAILED → retry from failed step`,pts:["from=last_run_at prevents drift accumulation over months of operation","Atomic transaction: either full reset happens or none → no partial state","DST transitions: cron library handles automatically (never implement yourself)","Month-end/leap year edge cases: cron library handles (Feb 30, etc.)"]},{name:"Resume From Failed Step",diag:`Example: Job with 5 steps. Step 2 (index=2) fails after max retries.

DB State:
  jobs: status=FAILED, current_step=2
  job_steps:
    step 0 (index=0): status=COMPLETED, output={user_valid:true}
    step 1 (index=1): status=COMPLETED, output={account_id:"acc_123"}
    step 2 (index=2): status=FAILED,    error_msg="Connection timeout"
    step 3 (index=3): status=PENDING
    step 4 (index=4): status=PENDING

User triggers RETRY (POST /jobs/{id}/retry):
  UPDATE jobs SET status='PENDING' WHERE job_id=?
  UPDATE job_steps SET status='PENDING', retry_count=0
    WHERE job_id=? AND status='FAILED'
  -- DO NOT touch COMPLETED steps!

Worker picks up the job:
  SELECT FROM job_steps
    WHERE job_id=? AND status!='COMPLETED'
    ORDER BY step_index ASC LIMIT 1
  → Returns step 2 (first non-COMPLETED)

Step 2's input is pre-stored from step 1's output
Worker resumes from step 2 → runs step 2 → step 3 → step 4
Steps 0 and 1: NEVER re-executed (already COMPLETED)

KEY INSIGHT: Step idempotency still required!
  If step 2 partially succeeded before failing
  (e.g., sent an email but didn't update DB)
  → step must be designed to handle re-execution safely`,pts:["COMPLETED steps are never touched again — safe for non-idempotent operations","The UNIQUE (job_id, step_index) constraint prevents duplicate step rows","output column carries data between steps — no external state store needed","For long-running steps: heartbeat updates step.updated_at → watchdog detects stale"]}],
xq:[{q:"The interviewer said 'writing next_run_at to PostgreSQL after every job = too many writes'. How do you respond?",a:"First, quantify: 116 jobs/sec × 6 rows = 700 writes/sec. PostgreSQL handles 5,000-10,000 writes/sec comfortably. That's 10% utilisation — not a concern. If truly needed: PgBouncer connection pooling + batch UPDATE statements (one statement for all 5 steps instead of 5 individual queries). Never switch databases without running the numbers."},{q:"Interviewer pushed to Cassandra. 'What about relations?'",a:"Walk it back: Cassandra is wrong here. It loses (1) ACID multi-table transactions — can't atomically reset jobs + job_steps, leading to silent corruption on crashes. (2) SELECT FOR UPDATE SKIP LOCKED — need Redis locks anyway. (3) Complex query support (WHERE status + next_run_at not natural Cassandra query pattern). 700 writes/sec doesn't justify losing correctness.",pb:true},{q:"How does SELECT FOR UPDATE SKIP LOCKED prevent double execution?",a:"When Worker 1 runs: FOR UPDATE locks all returned rows. When Worker 2 runs simultaneously: SKIP LOCKED means it skips rows locked by Worker 1 and picks the next available rows. Each worker gets a completely disjoint set of jobs — no coordination needed. No race condition. No Redis lock needed for this step. UPDATE SET status='RUNNING' inside the same transaction atomically claims ownership."},{q:"How do you handle a worker that crashes mid-step?",a:"Watchdog Service runs every 30 seconds: SELECT FROM jobs WHERE status='RUNNING' AND updated_at < NOW() - INTERVAL '5 minutes'. Workers update job.updated_at as heartbeat every 30 seconds. Watchdog finds orphaned RUNNING jobs → resets job to PENDING, step to PENDING. New worker picks up and re-executes the step (step must be idempotent). Lock TTL in Redis also releases automatically."},{q:"For cron: who calculates next_run_at?",a:"Two moments: (1) At job creation: API server calls cronLib.next(expr, from=NOW(), tz=user_tz) → stores in DB. (2) After each execution: worker calls cronLib.next(expr, from=LAST_RUN_AT, tz=job.tz) — CRITICAL: use last_run_at not NOW() to prevent drift. Both use a battle-tested library (croniter/node-cron/Quartz) — never implement cron parsing manually."}]}

deep:[{name:"Risk Engine: Atomic Margin Check",diag:`PROBLEM: User has ₹10,000 margin
  Two orders placed simultaneously for ₹8,000 each
  Both should be rejected (total = ₹16,000 > ₹10,000)
  
  WRONG (read then write — race condition):
    Thread A reads: funds = 10,000 → sufficient → proceed
    Thread B reads: funds = 10,000 → sufficient → proceed
    Both orders placed → OVERDRAFT!

  CORRECT: Redis DECRBY (atomic):
    Thread A: DECRBY funds:user1 8000 → result = 2,000 → ALLOW
    Thread B: DECRBY funds:user1 8000 → result = -6,000 → REJECT
              INCRBY funds:user1 8000  ← restore immediately
  
  Redis is single-threaded → DECRBY is atomic → no race condition
  2 simultaneous calls → one executes first → correct result always

  On order cancellation or rejection by exchange:
    INCRBY funds:{user_id} {margin} ← release margin immediately`,pts:["Redis DECRBY + check result: single atomic operation, no locking needed","INCRBY to revert on rejection: always happens in same request before returning","Exchange rejection reason logged in orders.rejection_reason","Zero chance of overdraft if every order goes through this atomic check"]},{name:"Market Data Fan-Out at Scale",diag:`PROBLEM: 500K ticks/sec → 2M users
  If we push every tick to every user → 500K × 2M = 1 Quadrillion messages/s!

  SOLUTION: publish-subscribe per symbol
  
  User subscribes to RELIANCE:
    WS Server A: SADD sub:RELIANCE server-A
    
  On RELIANCE tick (Kafka consumer):
    SMEMBERS sub:RELIANCE → {server-A, server-B, ...}
    Send tick data only to those servers
    Each server pushes to its subscribed clients
  
  Total messages = ticks × servers_watching_symbol
  NIFTY50 stocks (watched by everyone): all 20 servers × 1 tick
  Obscure stock (10 servers watching): 10 servers × 1 tick
  
  Why not push to Redis pub/sub per symbol?
    Redis pub/sub: works, but limited to 1 subscriber per channel type
  Better: WS servers directly consume Kafka partitions
    Each WS server subscribes to Kafka partitions for its symbols
    No Redis intermediary needed
    Scale: add more WS servers → Kafka rebalances partitions`,pts:["Selective delivery by symbol subscription reduces fan-out dramatically","SADD/SMEMBERS per symbol: O(1) to find which servers need the tick","For most symbols: < 5 WS servers subscribed at any time","Market hours only (6.25h/day): auto-scale up at 9AM, down at 3:30PM"]}],
xq:[{q:"How do you prevent a user from being charged twice for a rejected order?",a:"Margin is released atomically if order is rejected. Flow: DECRBY funds (hold margin) → submit to exchange → if exchange rejects (insufficient capital, circuit limit, invalid price) → INCRBY funds (release margin) immediately in the same request. No held margin if order doesn't go to exchange. For filled orders: margin adjusts based on actual fill price, not order price."},{q:"What happens during an exchange circuit breaker (stock hits upper circuit)?",a:"NSE sends a MARKET_HALT message via FIX for that symbol. Feed Handler: SET circuit:{symbol} HALTED. Risk Engine: check circuit status on every order → immediately reject with '422 Circuit limit triggered'. Circuit cleared: NSE sends MARKET_RESUME → DEL circuit:{symbol}. No manual intervention needed. Users see 'Trading halted for SYMBOL' message.",pb:true},{q:"How do you handle the 3:15 PM intraday auto square-off?",a:"Scheduled job (distributed scheduler, Problem 16) fires at 3:15 PM. Scans all open MIS positions: SELECT from orders WHERE trade_type='MIS' AND status='OPEN'. For each: place a MARKET order in the opposite direction (BUY→SELL, SELL→BUY). Market orders ensure execution before 3:30 PM close. Users notified via push 15 minutes prior (3:00 PM warning). Square-off orders bypass user rate limit but go through risk engine."}]},

hld:`WRITE (CREATE PASTE):
  Client → POST /api/v1/pastes
    1. SHA-256(content) → check dedup: SELECT WHERE content_hash=?
       If exists AND visibility matches → reuse s3_key (no duplicate upload)
    2. LPOP key_pool_ready → 8-char key  [O(1), atomic, no collision]
    3. Upload content to S3:
       Key: pastes/{key[0:2]}/{key[0:4]}/{key}.txt
       (Two-level prefix prevents S3 hot-prefix throttling)
    4. INSERT pastes (short_key, s3_key, content_hash, metadata)
    5. ZADD expiry_queue {expires_at_unix} {short_key}  [Redis]
    6. Return short URL

READ (VIEW PASTE):
  Client → GET /p/{short_key}
    1. Redis GET paste:{key} → cache HIT: return content (<5ms)
    2. Cache MISS → MySQL SELECT WHERE short_key=?
    3. Check: expired? → 410 | private + not owner? → 403
    4. Fetch content from S3 (or CDN for public)
    5. SET paste:{key} EX {min(ttl, 3600)} [cache for up to 1hr]
    6. Apply syntax highlighting (server-side, cached)
    7. Async: INCR view:{key} [Redis, flush to MySQL every 60s]

EXPIRY (every 60 seconds):
  ZRANGEBYSCORE expiry_queue 0 {now}
  For each expired key:
    DEL paste:{key} [Redis cache]
    S3 delete object
    UPDATE pastes SET status='EXPIRED'
    RPUSH key_pool_ready {key}  ← return key to pool!
  ZREM expiry_queue {processed_keys}`,
hldWhy:[["MySQL metadata","small rows + ACID for owner/expiry/visibility"],["S3 content blobs","cheaper than DB ($23 vs $80/TB); CDN-friendly"],["Content-hash dedup","same paste → shared S3 object; refcount tracked"],["CDN long TTL","content hash in URL; never invalidate"],["Background sweeper","TTL expiry; release blobs on refcount=0"],["Why not DB TEXT?","backups grow; no CDN; 5× cost at scale"]],
deep:[{name:"S3 vs Database for Content Storage",diag:`WHY S3 (not storing text in MySQL column)?

1. Cost: S3 = $23/TB/month vs MySQL SSD EBS = $100/TB/month
   For 12TB: S3=$276/mo vs MySQL=$1,200/mo — 4× cheaper

2. DB performance: 10MB TEXT column in MySQL:
   → Slows down table scans (even if never selected)
   → Index bloat (MySQL can't index TEXT efficiently)
   → Backup time grows linearly with content size
   → S3 is purpose-built for arbitrary blob storage

3. CDN integration: S3 → CloudFront is native
   Public pastes served directly from CDN edge
   No app server involvement after first fetch per edge

4. S3 Prefix Sharding:
   Key "abc12345" → S3 path: pastes/ab/abc1/abc12345.txt
   Why? S3 throttles at ~3,500 GET/s per prefix
   Two-level prefix (26×26 = 676 prefixes) → each prefix handles
   1,160/676 ≈ 1.7 reads/sec — far below S3 limits`,pts:["Deduplication via content_hash: same content → same S3 key, new short_key","S3 durability: 11 nines (99.999999999%) — much better than any DB","Content-Type always text/plain or text/html (never application/octet-stream to prevent malware)","CDN Cache-Control: public pastes = max-age=3600; private = no-store"]}],
xq:[{q:"How is Pastebin different from URL Shortener?",a:"URL Shortener stores only ~200B metadata (a URL). Pastebin stores up to 10MB blobs that must go to S3 (DB is wrong for large blobs). Pastebin needs content deduplication (SHA-256), syntax highlighting, visibility controls (Private/Unlisted), and a CDN for public content delivery. Key generation (KGS) is identical. Both are read-heavy with similar Redis caching strategy, but Pastebin's payload is thousands of times larger per response."},{q:"How do you handle a viral paste getting 10M reads in an hour?",a:"Public pastes are served by CDN (CloudFront). After the first viewer in each CDN region fetches the paste → CDN fills its cache from S3. All subsequent viewers in that region get a CDN hit — S3 and app servers are completely bypassed. 10M reads/hour = ~2,800 RPS globally distributed across CDN edges. No scaling needed on our side — CDN handles it.",pb:true}]},

apis:[{m:"GET",p:"/api/v1/documents/{id}",auth:"Bearer token",desc:"Open a document (load initial state)",req:"(no body)",res:'{\n  "doc_id": "uuid",\n  "version": 15420,\n  "content": "...current document content...",\n  "collaborators": [{"user_id":"u1","name":"Alice","cursor_pos":450}],\n  "ws_url": "wss://collab-07.docs.io/d/{doc_id}"\n}',codes:"200 OK | 403 No access | 404 Not found"},{m:"POST",p:"WebSocket: SEND OP",auth:"WS connection auth",desc:"Send an edit operation",req:'{\n  "type": "op",\n  "op": {\n    "type": "insert",\n    "position": 150,\n    "content": "Hello "\n  },\n  "client_version": 15420,\n  "client_id": "uuid"\n}',res:'{\n  "type": "ack",\n  "server_version": 15421,\n  "transformed_op": { "type":"insert","position":155,"content":"Hello " }\n}',codes:"ACK or ERROR"},{m:"GET",p:"/api/v1/documents/{id}/history",auth:"Bearer token (Editor+)",desc:"Get version history",req:"Query: ?from_version=0&to_version=1000",res:'{ "snapshots": [{"version":100,"named":false,"created_at":"..."},{"version":200,"name":"Draft v1","created_at":"..."}] }',codes:"200 OK"},{m:"POST",p:"/api/v1/documents/{id}/share",auth:"Bearer token (Owner/Editor)",desc:"Share document with a user",req:'{ "email": "bob@example.com", "role": "EDITOR" }',res:'{ "shared": true, "access_link": "https://docs.io/d/{id}?token=..." }',codes:"200 OK | 404 User not found"}],
hld:`USER A OPENS DOCUMENT:
  GET /documents/{id}
    → Fetch latest Spanner snapshot (version N)
    → Replay Bigtable ops from version N to current (max 100 ops)
    → Return current content + version + WS server address
  
  Connect WebSocket to assigned Collab Server
  (all editors of same doc → same Collab Server via consistent hash(doc_id))

USER A TYPES "Hello ":
  Client: apply op locally immediately (optimistic UI)
  Client: send { op: Insert(pos=5,"Hello "), client_version=100 }
  
  Collab Server (in-memory, per-document):
    1. If client_version == server_version: no transform needed
    2. If client_version < server_version:
       op' = Transform(op, all ops from client_version to server_version)
    3. Apply op' to in-memory document state → version++
    4. Persist op' to Bigtable (async via Kafka)
    5. Broadcast op' to ALL other clients on this doc via WS
    6. ACK sender: { new_version: 101, transformed_op: op' }
  
  CLIENT B receives op':
    B may have local unconfirmed ops → transform op' against those
    Apply to local doc → UI updates
  
  SNAPSHOT EVERY 100 OPS:
    Snapshot Service (Kafka consumer):
    When version % 100 == 0:
      Write full content to Spanner
      Update documents.snapshot_version`,
hldWhy:[["WebSocket per doc","low-latency op delivery; one doc-server owns each"],["OT (central server)","total order over ops; mature for rich text vs CRDT"],["Cassandra/Bigtable ops log","append-only; partition by doc_id"],["S3 snapshots every 100 ops","fast load on doc open"],["Spanner/PG metadata","ACID for permissions + version pointers"],["Why OT not CRDT?","central server already exists for auth; OT is simpler/smaller"]],
deep:[{name:"Operational Transformation (OT): How It Works",diag:`Initial doc: "ABCD"  (version 0)

User A at v0: Insert(2, "X") → "ABXCD"  ← server processes first
User B at v0: Insert(2, "Y") → sent to server AFTER A's op is applied

Server state: "ABXCD" (version 1)
B's op arrives at client_version=0, server is at version=1

TRANSFORM B's op against all ops from v0 to v1 (i.e., A's Insert(2,"X")):
  B.type = Insert, B.position = 2
  A.type = Insert, A.position = 2, A.content.length = 1
  
  Rule: if B.position >= A.position:
    B'.position = B.position + A.content.length = 2 + 1 = 3

Apply B' = Insert(3, "Y") to "ABXCD":
  Result: "ABXYCD"  ← version 2

Send op' = Insert(3, "Y") to User A:
  A applies to "ABXCD" → "ABXYCD"  ← SAME RESULT ✓

Both users converge to "ABXYCD" — no corruption!

Key insight: Transform function must handle EVERY combination:
  Insert vs Insert (shown above)
  Insert vs Delete (shift positions)
  Delete vs Delete (handle overlapping ranges)
  Delete vs Insert (same as Insert vs Delete, symmetric)`,pts:["Transform functions are the hard part — 4 combinations, each with edge cases","OT requires a central server to order operations (why one Collab Server per doc)","Client also transforms: received server ops against its own unconfirmed ops","Google Docs uses OT (patented), newer systems prefer CRDTs (Yjs, Automerge)"]},{name:"Version History: Load Any Past State",diag:`Architecture:
  Bigtable: append-only op log (every single character typed)
  Spanner: snapshots every 100 ops (full document content)

Loading current state:
  1. FETCH latest Spanner snapshot (version N, say 15,400)
  2. FETCH ops from Bigtable: version 15,401 to 15,462 (current)
  3. APPLY 62 ops to snapshot content
  4. Result: current document in <100ms
  
  Without snapshots: replay ALL 15,462 ops from empty doc → seconds!

Loading state at version 14,500:
  1. FETCH Spanner snapshot at version 14,400 (nearest ≤ 14,500)
  2. FETCH ops 14,401 to 14,500 (100 ops max)
  3. APPLY → state at version 14,500
  
  RESTORE: load state at version 14,500
            → create new op: REPLACE(current_content, historical_content)
            → this op is appended to op log (history preserved, not overwritten)`,pts:["Snapshots are the key: limit replay to max 100 ops regardless of document age","Bigtable op log is append-only: history is never lost or overwritten","Restore = insert a new 'replace' op: history shows the restoration event","Named versions: Spanner snapshot with named=true, user-given name"]}],
xq:[{q:"What happens if two users delete the same text simultaneously?",a:"OT transform handles this. B's Delete(3,2) transformed against A's Delete(3,2): A already deleted chars 3-4. B's target range is partially or fully gone. Transform detects overlap: B's op becomes a no-op or is shortened to cover only the non-deleted portion. The transform function for Delete-vs-Delete must handle: no overlap, partial overlap, full overlap, containment. This is the most complex case in OT implementation."},{q:"How does the server route clients to the right Collab Server?",a:"consistent_hash(doc_id) → Collab Server cluster node. The assignment is stored in Redis: doc:{id}:server → server_address. All clients opening the same doc get the same server address. If the server has spare capacity: existing connection. If overloaded: migration (drain connections, move to new server — advanced). Session Assignment Service: stateless API that looks up or creates the doc's server assignment.",pb:true},{q:"What if the Collab Server crashes while 50 people are editing?",a:"All 50 WS connections drop. Clients detect disconnect and reconnect (exp backoff). Kafka retains all uncommitted ops (the in-memory ops that weren't persisted yet may be lost — max 1-2 seconds of ops). New Collab Server assigned for that doc_id. New server: load latest Spanner snapshot + replay Bigtable ops (including any ops that made it to Bigtable) → reconstruct state. Clients reconnect, resend any unacked ops."},{q:"Why doesn't this work as multiple Collab Servers for the same document?",a:"OT requires a total ordering of operations. If two servers both receive concurrent ops and apply them independently, their states diverge — the transform function assumes one server decides the order. A single Collab Server per document is the serialization point. This is OT's fundamental requirement (vs CRDT which is genuinely decentralized). The Collab Server is stateless between sessions — state is always recovered from Spanner + Bigtable."}]},

apis:[{m:"GET",p:"/api/v1/shows/{show_id}/seats",auth:"Optional",desc:"Get current seat availability map",req:"(no body)",res:'{\n  "show_id": "uuid",\n  "venue": { "name":"PVR Phoenix", "capacity":800 },\n  "seats": [\n    {"seat_id":"A1","status":"AVAILABLE","price":2000,"category":"GOLD"},\n    {"seat_id":"A2","status":"HELD","price":2000},\n    {"seat_id":"A3","status":"BOOKED","price":2000}\n  ],\n  "available_count": 423\n}',codes:"200 OK | 404 Show not found"},{m:"POST",p:"/api/v1/holds",auth:"Bearer token",desc:"Hold selected seats for 10 minutes",req:'{ "show_id":"uuid","seat_ids":["A1","A2"],"idempotency_key":"uuid" }',res:'{ "hold_id":"uuid","seat_ids":["A1","A2"],"expires_at":"2024-01-15T09:10:00Z","payment_url":"https://..." }',codes:"200 OK | 409 Seat already held/booked | 429 Rate limit"},{m:"POST",p:"/api/v1/bookings",auth:"Bearer token",desc:"Confirm booking after payment",req:'{ "hold_id":"uuid","payment_method_id":"pm_123","idempotency_key":"uuid" }',res:'{ "booking_id":"uuid","status":"CONFIRMED","qr_code_url":"https://s3.../ticket.pdf","seats":["A1","A2"] }',codes:"201 Created | 408 Hold expired | 402 Payment failed | 409 Duplicate (idempotency)"},{m:"POST",p:"/api/v1/bookings/{id}/cancel",auth:"Bearer token (must be booking owner)",desc:"Cancel a booking",req:'{ "reason": "change_of_plans" }',res:'{ "booking_id":"uuid","refund_amount":1600,"refund_status":"PROCESSING","eta":"5-7 business days" }',codes:"200 OK | 400 Past cancellation window | 403 Not owner"}],
hld:`BROWSE (Read-Heavy):
  Client → CDN (event pages) → Redis (seat counts) → MySQL

SEAT HOLD (Redis Lua — ATOMIC — the critical part):
  POST /holds → Booking Service → Redis Lua script:
  ┌───────────────────────────────────────────────────────────┐
  │ for each seat_id in [A1, A2]:                            │
  │   status = HGET seatmap:{show_id} {seat_id}:status       │
  │   if status != "AVAILABLE": return "SEAT_UNAVAILABLE"    │
  │ -- All seats available, now hold atomically:              │
  │ for each seat_id in [A1, A2]:                            │
  │   HSET seatmap:{show_id}                                  │
  │     {seat_id}:status "HELD"                              │
  │     {seat_id}:held_by {user_id}                          │
  │     {seat_id}:held_until {now+600}                        │
  │ ZADD holds_expiry {now+600} "{show_id}:{seat_ids}:{uid}" │
  │ return "OK"                                              │
  └───────────────────────────────────────────────────────────┘
  Write hold to MySQL async (via Kafka) — for durability

PAYMENT & CONFIRM:
  User pays → Payment Service (idempotency_key=hold_id)
  On SUCCESS → Booking Service:
    BEGIN TRANSACTION [MySQL]:
      SELECT hold WHERE hold_id=? AND status=ACTIVE AND expires_at>NOW()
      SELECT seats WHERE seat_id IN ('A1','A2') FOR UPDATE
      UPDATE seats SET status=BOOKED
      INSERT bookings (CONFIRMED)
    COMMIT
    HSET seatmap:{show_id} A1:status "BOOKED", A2:status "BOOKED"
    DEL from holds_expiry ZSET
    Kafka "booking-confirmed" → QR Generator, Email, Analytics

HOLD EXPIRY (every 30 seconds):
  ZRANGEBYSCORE holds_expiry 0 {now}
  Redis Lua: if seat still HELD by this user → AVAILABLE
  DB: hold status=EXPIRED

VIRTUAL QUEUE (blockbuster sales):
  Users admitted at controlled rate (e.g., 200/sec)
  Redis ZADD waitlist:{event_id} {arrival_time} {user_id}
  Drip users via ZPOPMIN → each gets short-lived JWT to attempt hold`,
hldWhy:[["Redis hash for seat state","atomic Lua hold; sub-ms race resolution"],["TTL on holds (7min)","auto-release abandoned holds; no manual cleanup"],["Virtual queue","buffers flash-sale spike before inventory pipeline"],["MySQL bookings","ACID + audit; source of truth"],["Kafka order events","decouples checkout → email/inventory"],["Why Redis not MySQL FOR UPDATE?","row-lock contention at flash-sale scale; Lua is 100× faster"]],
deep:[{name:"Why Redis Lua (not DB transaction) for Seat Hold",diag:`PROBLEM: 1,667 seat holds/sec on same show (blockbuster sale)
  All hitting the same seat rows simultaneously

OPTION A: MySQL SELECT FOR UPDATE (database lock):
  Thread A: SELECT seat WHERE id='A1' FOR UPDATE → lock acquired
  Thread B: SELECT seat WHERE id='A1' FOR UPDATE → BLOCKS, WAITS
  → Thread B waits for Thread A to COMMIT (50-200ms per txn)
  → At 1,667/s: massive lock contention → timeouts → poor user experience

OPTION B: Redis Lua script (CORRECT for concurrency):
  Redis is single-threaded: Lua executes as ONE atomic command
  Thread A's Lua: checks A1 status, marks HELD
  Thread B's Lua: runs AFTER A's completes (not concurrently)
  → No waiting, no contention, O(1) per seat
  → Redis handles 100K ops/sec → 1,667/s is trivial
  
  Two requests for SAME seat:
    Request 1 Lua: A1 = AVAILABLE → set HELD (success)
    Request 2 Lua: A1 = HELD → return "SEAT_UNAVAILABLE" (fast rejection)
  
  WHY NOT REDIS MULTI/EXEC?
    WATCH + MULTI/EXEC: optimistic lock, retries on conflict
    Under high concurrency: retry storm → worse performance than Lua
    Lua: guaranteed atomic execution, no retries needed`,pts:["Redis Lua = the right tool for atomic multi-key check-and-set","MySQL SELECT FOR UPDATE is used at payment confirmation (authoritative)","Defense in depth: Redis Lua (fast) + MySQL FOR UPDATE (authoritative) + UNIQUE constraint (safety net)","Never use Redis MULTI/EXEC for rate-limiting or seat-locking — Lua is better"]},{name:"QR Ticket: Secure and Offline-Verifiable",diag:`QR Code Content (signed payload):
{
  "booking_id": "uuid",
  "show_id": "uuid",
  "seat_ids": ["A1","A2"],
  "user_id": "uuid",
  "issued_at": "2024-01-15T10:00:00Z",
  "signature": "HMAC-SHA256(payload, SERVER_SECRET)"
}

Signing:
  signature = HMAC-SHA256(
    booking_id+show_id+seat_ids+user_id+issued_at,
    SERVER_SECRET
  )

At venue scanner:
  1. Decode QR → extract JSON payload
  2. Recompute HMAC-SHA256 of payload fields
  3. Compare with signature in QR
  4. If match → valid ticket! (no internet needed)
  5. POST to backend (async): mark booking as USED
     (prevents re-entry with same QR code)

Why HMAC, not just booking_id lookup?
  HMAC works offline (no internet at gate)
  Cannot be forged without SERVER_SECRET
  Even if someone guesses booking_id: HMAC will fail`,pts:["Offline verification: works even if gate scanner has no internet","HMAC: server secret is never in the QR code itself","Backend marks USED async: if connectivity issue, mark as soon as connection restores","PDF generated async (Kafka consumer): Puppeteer → S3 → email/download"]}],
xq:[{q:"How do you guarantee zero double-booking under extreme concurrency?",a:"Three-layer defense: (1) Redis Lua atomic check-and-hold — two requests for same seat: first Lua succeeds, second sees HELD and returns error. Lua is single-threaded in Redis — no race condition. (2) MySQL SELECT FOR UPDATE at booking confirmation — row-level lock ensures only one transaction can confirm the same seat, even if Redis state is somehow inconsistent. (3) Unique constraint in DB: (show_id, seat_id, status=BOOKED) — DB physically rejects any attempt to book the same seat twice."},{q:"What happens if payment times out — is the seat held forever?",a:"Hold TTL is 10 minutes in Redis ZADD expiry_queue. If payment doesn't complete in 10 minutes: hold expires, seat released back to AVAILABLE. If payment gateway processes AFTER hold expired: (1) Booking service checks: SELECT hold WHERE expires_at > NOW() — finds it expired → return 408 Hold Expired → refund via gateway if charged. The gateway idempotency key (hold_id) ensures the charge isn't retried after refund.",pb:true},{q:"How does the virtual waiting room work for blockbuster ticket sales?",a:"At sale open: all users hit a static 'waiting room' page (served by CDN, zero server load). User's browser POSTs to queue service → ZADD waitlist:{event} {arrival_time} {user_id}. Control plane: ZPOPMIN waitlist 200 every second → 200 users admitted/sec. Each admitted user: issued a short-lived JWT token (5-min validity) authorizing them to initiate a seat hold. Users in queue: see live position via SSE (Server-Sent Events, lightweight). This caps hold API at 200 req/sec regardless of millions of users trying to get tickets."}]},

hld:`CARD PAYMENT FLOW:
  Merchant → POST /charges (idempotency_key=order_O123)

    5. Submit to Acquirer via ISO 8583 / REST (FIX-like)
       Acquirer → Card Network → Issuing Bank
       → AUTH_CODE or DECLINE or TIMEOUT
    6. SUCCESS: status=AUTHORISED → CAPTURED [DB + Kafka]
    7. FAILURE: try next acquirer (soft decline only)

UPI FLOW (ASYNC):

deep:[{name:"PCI-DSS: Vault Architecture",diag:`PCI-DSS Level 1: required for >6M card transactions/year

WHAT PCI REQUIRES:
  Raw PAN (Primary Account Number) must NEVER be stored
  except in the Vault (Cardholder Data Environment = CDE)

VAULT ARCHITECTURE:
  Separate isolated VPC (CDE):
    - No direct internet access (only ingress from internal services)
    - Strict firewall rules (only Vault Service can communicate with CDE)
    - HSM (Hardware Security Module) holds encryption keys
    - All data encrypted: AES-256-GCM with HSM-managed keys

TOKEN FLOW:
  Merchant checkout page → user enters card number
  Card number sent directly to Vault Service (NOT to merchant)
    → Vault: PAN encrypted with HSM key → stored in CDE
    → Vault returns: token = "tok_Xk3mP9..." (meaningless string)
    → Token stored by merchant (no PAN stored anywhere outside CDE)
  
  On charge: merchant sends token
    → Vault: look up PAN for this token
    → Vault submits PAN to acquirer directly (never goes through merchant)
  
  Merchant breach: attacker gets tokens → useless (can't reverse to PAN)
  CDE breach: PAN encrypted with HSM key → useless without HSM access`,pts:["HSM: Hardware Security Module — tamper-proof device that manages encryption keys","Keys never exist in software/RAM — only in HSM","Vault Service has no internet access — physically isolated","Annual PCI audit required — compliance is a business requirement, not optional"]},{name:"Idempotency: No Double Charge Under Any Failure",diag:`FAILURE SCENARIO:
  Merchant's server sends charge → network times out
  Merchant retries → without idempotency → DOUBLE CHARGE!

SOLUTION: 4-layer idempotency:

LAYER 1: Redis SETNX (fastest check):
  SETNX idempotency:{key} {txn_id} EX 86400
  → If NX fails: key exists → return cached txn_result
  → Set before processing: second call returns original result

LAYER 2: DB UNIQUE constraint:
  CREATE UNIQUE INDEX ON transactions(idempotency_key)
  → Even if Redis loses the key (eviction/restart):
     DB rejects INSERT with duplicate idempotency_key
     → Return existing transaction

LAYER 3: Payment gateway idempotency key:
  Send idempotency_key to Stripe/Razorpay as header
  Gateway: same key = cached result (no re-processing)
  → Even if we accidentally call gateway twice: no double charge

LAYER 4: Acquirer STAN (Systems Trace Audit Number):
  Each acquirer transaction has a unique STAN
  On TIMEOUT: query acquirer with STAN to check if it processed
  → Don't retry without knowing if original succeeded`,pts:["4 layers: Redis → DB constraint → gateway → acquirer STAN","Query before retry: on timeout, always query status before resending","Idempotency key TTL = 24h: covers any reasonable retry window","Test: simulate each failure mode to verify no double charge"]}],
xq:[{q:"How do you handle the case where the acquirer times out?",a:"UNCERTAIN state — don't know if acquirer processed the request. NEVER retry immediately (risk of double charge). Protocol: (1) Record transaction as TIMEOUT in DB. (2) Query acquirer status API with original STAN (within 5 seconds). (3) If confirmed AUTHORISED → proceed to capture. If confirmed FAILED → update to FAILED. If still UNKNOWN → async reconciliation job runs every 5 minutes and checks all TIMEOUT transactions against acquirer's batch file."},{q:"How does smart routing increase payment success rates?",a:"Track success_rate(acquirer, card_network, BIN_prefix, amount_bucket) using a sliding 5-minute window in Redis. HDFC Acquirer may succeed 96% for HDFC cards vs 88% for Axis Bank Acquirer. Route to the best-performing acquirer for each transaction's dimensions. A/B test: route 90% to primary, 10% to backup to keep backup warm. On primary failure: cascade to backup. Never retry hard declines (stolen card, insufficient funds) — only soft declines (timeouts, network errors).",pb:true},{q:"What makes UPI architecturally different from card payments?",a:"Card payments are synchronous pull — gateway submits auth request and gets a response in 2-3 seconds. UPI is asynchronous push — gateway sends a collect request to NPCI, NPCI routes to payer's bank app, payer manually approves (tap + PIN), NPCI sends a callback webhook. Total time: 5-60+ seconds. Architecture: transaction stays in PENDING state, client polls GET /charges/{id} or receives webhook. NPCI callback endpoint must be HA — NPCI retries if we return non-200."}]},

hld:`SOURCE DB (read from REPLICA, not primary):
  MySQL replica: binlog (ROW format required)
  PostgreSQL: WAL via replication slot + pgoutput plugin
  
  ┌─────────────────────────────────────────────────┐
  │    Debezium (Kafka Connect Plugin)              │
  │    Registers as MySQL replica (COM_BINLOG_DUMP) │
  │    Reads binlog continuously                    │
  │    Deserialises row changes → CDC events        │
  │    Checkpoints binlog offset in Kafka           │
  └────────────────────────┬────────────────────────┘
                           │
  ┌────────────────────────▼──────────────────────────┐
  │    Kafka topics: cdc.{db}.{table}                │
  │    Partitioned by primary key                    │
  │    Ordering guaranteed per row                   │
  └──────┬─────────────┬──────────┬───────┬──────────┘
         │             │          │       │
  ┌──────▼──┐   ┌──────▼──┐ ┌────▼──┐ ┌──▼──────┐
  │ ES Sink │   │ Cache   │ │ DW    │ │Microsvcs│
  │ UPSERT  │   │Invalidate│ │ Batch │ │ Logic   │
  │ by doc_id│  │Redis DEL │ │ 60s   │ │ trigger │
  └─────────┘   └─────────┘ └───────┘ └─────────┘

INITIAL SNAPSHOT (bootstrapping new consumer):
  1. Debezium records current binlog position (LSN)
  2. Read table in chunks: SELECT WHERE id > last_id LIMIT 10000
     Emit each row as op='r' (read) events
  3. After snapshot complete: switch to binlog at LSN from step 1
  4. No gap between snapshot and live stream → zero data loss

SCHEMA REGISTRY:
  All events serialised as Avro
  Schema registered once → schema_id (integer)
  Message: [magic_byte][schema_id(4B)][avro_payload]
  Consumer fetches schema by ID → deserialise
  → Backward compatible changes (add nullable field): automatic
  → Breaking changes: new topic version + consumer migration`,
hldWhy:[["Read DB's WAL/binlog","no dual-write; DB is single source of truth"],["Kafka topics per table","decoupled consumers at their own pace; replay supported"],["Schema registry","compatibility checked at registration; breaking changes blocked"],["Idempotent consumers","PK + LSN dedup → effectively exactly-once"],["Incremental snapshot","huge tables backfill while WAL streams"],["Why not app dual-write?","dual-writes race; DB and Kafka can diverge silently"]],
deep:[{name:"How MySQL Binlog CDC Works",diag:`MySQL writes every committed transaction to BINARY LOG:
  Purpose: MySQL replication to replicas
  Format: MUST be ROW (not STATEMENT or MIXED)
    ROW: records actual before/after values of each changed row
    STATEMENT: records SQL statement (non-deterministic, risky for CDC)

Debezium connects as a MYSQL REPLICA:
  Sends: COM_BINLOG_DUMP command to MySQL
  MySQL streams new binlog events continuously
  Debezium reads: TableMapEvent (schema), RowsEvent (data changes)

Binlog Position (resumability):
  file: mysql-bin.000042, pos: 12345
  Debezium commits position to Kafka Connect offset store
  On restart: resume from last committed position
  → No events lost (as long as binlog not expired)

Binlog retention:
  expire_logs_days = 7 (default)
  Debezium offline > 7 days: binlog purged → can't resume
  Alert: monitor Debezium lag → alert if > 6 hours behind`,pts:["Read from REPLICA: zero impact on primary DB write performance","ROW binlog format: mandatory for accurate before/after values","Binlog offset = persistent bookmark: safe to restart Debezium anytime","PG equivalent: replication slot + LSN (Log Sequence Number)"]},{name:"Cache Invalidation via CDC (vs Application Code)",diag:`APPLICATION CODE APPROACH (common but fragile):
  After DB write: also call Redis DEL/SET
  
  PROBLEM: if app crashes BETWEEN DB write and Redis DEL:
  → DB has new value, Redis has stale value
  → Cache stays stale indefinitely until TTL expires
  → Requests read wrong data for potentially hours!

CDC APPROACH (reliable):
  DB write → binlog → Debezium → Kafka → Cache Invalidator consumer
  → Redis DEL cache:{key}  (or SET with new value from 'after' image)
  
  If consumer crashes: Kafka retains message → consumer resumes
  → Cache eventually invalidated (at-least-once)
  → Consumer is idempotent: Redis DEL is safe to call multiple times
  
  Write-through via CDC:
    'after' image contains new values → consumer does Redis SET
    → Cache always has fresh value after DB update
    → Eliminates cache miss on next read (faster than DEL + re-fetch)

  LATENCY: DB commit → binlog → Kafka → consumer → Redis
  Typically < 1 second end-to-end
  Acceptable for most use cases`,pts:["CDC approach: reliable even under consumer crashes (Kafka retains messages)","Application code approach: subtle bug risk (crash between DB write and cache update)","Idempotent consumer: Redis DEL/SET can be called multiple times safely","For high-consistency requirements: use DB-level triggers to publish events atomically"]}],
xq:[{q:"Why is CDC better than polling the database for changes?",a:"Polling (SELECT WHERE updated_at > last_check) has critical problems: (1) Requires an updated_at column on every table — schema change. (2) Misses hard deletes — a deleted row disappears with no trace. (3) Creates load on the DB proportional to poll frequency. (4) Minimum latency = poll interval (typically 1-60 minutes for DB safety). CDC reads the binlog MySQL already writes for replication — zero extra DB load, captures deletes, sub-second latency, no schema changes needed."},{q:"Debezium goes down for 2 hours — are any events lost?",a:"MySQL: binlog retained for 7 days (expire_logs_days setting). Debezium resumes from last committed binlog offset — no events lost within 7-day window. PostgreSQL: WAL retained by replication slot (PG doesn't delete WAL the slot hasn't consumed). Risk: 2 hours of WAL = potentially GBs of disk — monitor disk and alert on WAL size. On recovery: Debezium processes all accumulated changes. Kafka consumer sees delayed events but no gaps.",pb:true},{q:"How do you handle a breaking schema change (ALTER TABLE rename column)?",a:"Breaking changes require coordination. Process: (1) Add new column with new name (backward compatible ADD). (2) Application writes to both columns. (3) CDC consumers migrate to read new column. (4) Remove old column (breaking DELETE). Steps 1-4 take 1-2 deployment cycles. Never do a breaking ALTER without first checking all CDC consumers. Avro Schema Registry rejects non-compatible schema changes — this is the enforcement mechanism. New incompatible schema → new Kafka topic → consumer migration."}]},

hld:`UPI ECOSYSTEM PLAYERS:
  PSP (GPay/PhonePe): app layer, VPA management, UI
  NPCI: central switch, routes between PSPs/banks
  Bank CBS: executes actual debit/credit on account ledger

P2P PAY FLOW (total: 3-10 seconds):
  ① User enters "bob@paytm" + ₹500
  ② GPay PSP: VPA resolution
     ReqValAdd → NPCI → Paytm PSP → is bob@paytm valid?
     ReqValAddResp → show "Bob Kumar" to payer
  ③ User enters UPI PIN (on GPay's custom keyboard):
     PIN encrypted with BANK's RSA public key ON DEVICE
     PSP CANNOT decrypt, NPCI CANNOT decrypt
  ④ ReqPay → NPCI:
     { payer_vpa, payee_vpa, amount, encrypted_PIN }
     NPCI assigns: UPI Txn Reference Number (unique, India-wide)
  ⑤ NPCI → Payer's Bank (SBI):
     Decrypt PIN (only bank has private key)
     Verify PIN against stored hash
     Check balance >= ₹500
     DEBIT ₹500 from payer's account
     RespPay { SUCCESS, bank_rrn }
  ⑥ NPCI → Payee's Bank (Paytm's bank partner):
     CREDIT ₹500
     Credit confirmation
  ⑦ NPCI → GPay PSP:
     RespPay { SUCCESS, npci_txn_ref }
  ⑧ GPay shows: "₹500 sent to Bob Kumar ✓"
     Both users receive SMS from their banks (RBI mandatory)

SETTLEMENT (end of day):
  NPCI multilateral netting: compute net position per bank
  → Only net amounts settled via RBI RTGS
  → Reduces actual fund movements by ~95%`,

deep:[{name:"UPI PIN Security: Never Leaves the Bank",diag:`PROBLEM: PIN must be sent to bank for verification
  But if PSP or NPCI sees the PIN → security breach!

SOLUTION: Asymmetric encryption on device

Setup:
  Bank publishes its RSA public key to NPCI
  NPCI distributes to all PSPs
  PSP embeds bank's public key in SDK

When user enters PIN:
  PSP custom keyboard (not system keyboard — no screenshot possible)
  User types "1234"
  SDK: encrypted_PIN = RSA_ENCRYPT("1234", bank_public_key)
  SDK: encrypted_PIN only decryptable by bank (has private key)
  
  Message flow:
  Device → PSP → NPCI → Bank
    Each hop: sees encrypted_PIN (ciphertext only)
    Only Bank: DECRYPT("RSA_DECRYPT", bank_private_key) → "1234"
    Bank: hash("1234") → compare with stored hash
  
  EVEN IF:
  GPay server is compromised → sees only ciphertext
  NPCI server is compromised → sees only ciphertext
  Network is intercepted → sees only ciphertext
  Only the specific bank can decrypt`,pts:["Custom keyboard prevents screenshots and screen recording","PSP implements the UI but never sees the PIN value","Key rotation: banks rotate RSA keys periodically, NPCI redistributes","PG for card: similar model — card number encrypted with PSP key at gateway"]},{name:"UPI Lite: Scaling Down to Offline",diag:`PROBLEM: Most UPI txns are small (<₹500)
  Each requires: NPCI round-trip + bank CBS round-trip + internet
  In rural India: poor connectivity → transactions fail or are slow

UPI LITE SOLUTION:
  On-device wallet, max ₹2000 balance, max ₹500 per txn

LOAD:
  User: "Load ₹2000 to UPI Lite" → normal UPI txn
  Bank account debited ₹2000 once
  Balance stored on device (secure element/TrustZone)
  Bank CBS: one debit for ₹2000 load

SPEND:
  Purchase ₹50 at tea shop:
    ZERO internet required
    ZERO PIN required  (small amount = low risk)
    ZERO bank CBS call
    Just: NFC/QR → on-device balance check → deduct
    → Device to device payment

SYNC (when internet available):
  Device sends all completed transactions to bank
  Bank updates individual txn log
  
  RBI VIEW:
    10B monthly txns × 80% < ₹500 = 8B UPI Lite eligible
    If 50% adopt UPI Lite: 4B fewer CBS round-trips/month
    Massive reduction in banking system load`,pts:["UPI Lite: ~80% of UPI transactions could be offline (< ₹500)","No PIN + no internet = much better UX for small payments","Balance on device = risk of loss if phone stolen (capped at ₹2000)","Periodic sync ensures audit trail and bank's records stay accurate"]}],
xq:[{q:"How is UPI different from NEFT, RTGS, and IMPS?",a:"NEFT: batch processing (every 30 min), any amount, not instant. RTGS: real-time, minimum ₹2 lakh, for large corporate transfers. IMPS: real-time, 24×7, uses account number + IFSC (clunky), max ₹5 lakh. UPI: real-time, 24×7, VPA-based (no account number needed), max ₹1 lakh per txn, supports QR/collect/mandate. UPI is essentially IMPS underneath with a user-friendly layer added by NPCI: VPA abstraction, PSP competition, merchant QR standards, and mandate support."},{q:"How does NPCI handle 15,000 TPS without becoming a single point of failure?",a:"NPCI's UPI switch deployed as active-active cluster across Mumbai primary + Chennai DR data centers. In-memory distributed grid (similar to Hazelcast) for: VPA→bank routing table, transaction dedup by reference number, per-bank request rate limiting. Dedicated leased lines to all member banks (not public internet — private MPLS network). Per-bank circuit breakers: if SBI CBS is slow, NPCI opens circuit for SBI requests to prevent cascading failure.",pb:true},{q:"What happens if the bank's CBS (Core Banking System) times out?",a:"NPCI marks the transaction as DEEMED FAILED after 30 seconds. PSP shows 'transaction pending verification.' But bank may have already debited the payer's account (partial completion). This creates a 'deemed failed' state: money deducted but not credited. NPCI auto-resolution: queries both banks for debit/credit records → initiates auto-reversal within T+1 if debit found without credit. RBI mandate: full resolution within 5 business days, ₹100/day penalty on the bank for delays."},{q:"How does UPI AutoPay (mandate) work for recurring payments?",a:"Mandate creation (one-time): user approves with UPI PIN → stored in bank CBS and NPCI mandate registry → mandate_id issued. Monthly execution (no PIN): merchant PSP calls NPCI with mandate_id → NPCI deducts from payer's bank → payer receives SMS notification (mandatory). User can revoke mandate at any time via their bank app. Reliability: execute 2 days early, retry on due date and due date+1 if funds insufficient. Pre-debit notification to user 24h before debit (RBI requirement)."}]},

hld:`W2W TRANSFER (<500ms):
  POST /transfers
    1. SETNX idempotency:{key} "" EX 86400  [Redis]
       → Exists? Return cached result (no re-processing)
    2. FX rate check (if currencies differ):
       GET fx_rates:{from_currency}:{to_currency}  [Redis, 60s TTL]
       Lock rate for 30 seconds: SET fx_lock:{txn_id} rate EX 30
    3. BEGIN TRANSACTION [PostgreSQL]:
       SELECT balance FROM wallets WHERE wallet_id=from FOR UPDATE
       ← Row-level lock prevents overdraft race condition
       IF balance < amount → ROLLBACK → 402 Insufficient funds
       UPDATE wallets SET balance=balance-amount WHERE from
       UPDATE wallets SET balance=balance+converted_amount WHERE to
       INSERT ledger (DEBIT entry for from_wallet)
       INSERT ledger (CREDIT entry for to_wallet)
       INSERT transactions (status=COMPLETED)
    COMMIT
    4. SET idempotency:{key} {txn_result_json} EX 86400 [Redis cache result]
    5. INCR wallet:{from}:balance -amount  [Redis balance cache]
       INCR wallet:{to}:balance +converted_amount
    6. Kafka "transfer-completed" → Notification, Analytics

A/C-TO-A/C (IMPS/NEFT — Saga Pattern):
  Step 1: Debit source wallet → credit SUSPENSE account [ACID]
  Step 2: Submit to external rail (IMPS/NEFT/SWIFT)
    → SUCCESS: debit SUSPENSE → credit destination → COMPLETED
    → FAILURE: debit SUSPENSE → credit source back → FAILED

SUSPENSE ACCOUNT:
  Money in-flight sits in SUSPENSE wallet
  Invariant: SUM(all wallets) + SUM(SUSPENSE) = CONSTANT
  Reconciliation: SUSPENSE balance near-zero at EOD (any residual = stuck txn)`,
hldWhy:[["Double-entry append-only","every tx debits+credits; sum=0 invariant"],["MySQL/PG + shard by account_id","ACID multi-row tx; Cassandra can't do this"],["Redis balance cache","100× reads per write; invalidate on write"],["Saga + suspense for cross-shard","money never disappears mid-transfer"],["Integer minor units","never use floats for money (rounding errors)"],["Why not single-balance column?","no audit; can't detect drift; partial-failure ambiguity"]],
deep:[{name:"Double-Entry Bookkeeping: Why It Matters",diag:`EVERY money movement = exactly 2 ledger entries, summing to ZERO

Example: Alice transfers ₹500 to Bob

entry 1: wallet=alice, type=DEBIT,  amount=50000, balance_after=450000
entry 2: wallet=bob,   type=CREDIT, amount=50000, balance_after=550000
         net: -50000 + 50000 = 0  ← conservation law

Why it matters:
  1. CONSERVATION: If net != 0, there's a bug (money created/destroyed)
  2. AUDITABILITY: Every balance change has a traceable counterpart
  3. RECONCILIATION: SELECT SUM(amount*direction) FROM ledger
                     WHERE wallet_id=? = current balance
  4. REGULATORY: Banks and financial regulators require this

Implementation rules:
  1. Ledger is APPEND-ONLY (never UPDATE or DELETE)
  2. Every transfer creates exactly 2 entries (same txn_id)
  3. Store balance_after for fast balance queries
     (vs computing SUM of all ledger entries — could be billions)
  4. Primary balance = wallets.balance (snapshot, updated transactionally)
     Ledger = audit trail (verify snapshot is correct)
  
  Nightly reconciliation:
    SELECT SUM(amount) FROM ledger WHERE wallet_id=? = wallets.balance
    Any mismatch → CRITICAL ALERT (data integrity issue)`,pts:["This is the accounting model used by every bank and fintech since 1494","Append-only ledger: forensic tool for disputes, regulatory audits","balance_after on each entry: reconstruct balance at any point in time","Never store money as FLOAT — use BIGINT in minor units (paise, cents)"]},{name:"SELECT FOR UPDATE: Preventing Overdraft",diag:`PROBLEM: Two simultaneous withdrawals of ₹800 from ₹1000 balance

WITHOUT LOCK (wrong):
  Thread A: SELECT balance=1000 FROM wallets WHERE id=alice
  Thread B: SELECT balance=1000 FROM wallets WHERE id=alice
  Thread A: balance(1000) > 800 → OK → UPDATE balance=200
  Thread B: balance(1000) > 800 → OK → UPDATE balance=200
  → Final balance: 200 (should have FAILED second request!)
  → OVERDRAFT: effectively processed ₹1600 from ₹1000

WITH SELECT FOR UPDATE (correct):
  Thread A: SELECT balance=1000 FROM wallets WHERE id=alice FOR UPDATE
            → acquires row-level lock on alice's wallet row
  Thread B: SELECT ... WHERE id=alice FOR UPDATE
            → BLOCKS (waits for Thread A to commit)
  Thread A: 1000 > 800 → UPDATE balance=200 → COMMIT
  Thread B: (unblocked) → reads balance=200 → 200 < 800 → ROLLBACK
  
  Result: Thread A succeeds, Thread B correctly fails

Performance:
  SELECT FOR UPDATE: row-level lock (only Alice's row locked)
  Thread B waiting on Alice's row doesn't affect Bob's wallet
  At 812 W2W/sec: very different wallet pairs → minimal contention
  Hot wallets (merchant receiving many payments): use Redis DECR
  as pre-check before DB transaction to reduce lock wait time`,pts:["Row-level lock: only same wallet pair contends — not global table lock","Pre-check balance in Redis before DB: filter out obvious failures fast","PostgreSQL MVCC: readers never block writers (SELECT without FOR UPDATE is always fast)","DB CHECK constraint (balance >= 0): final safety net even if code has bugs"]}],
xq:[{q:"How do you store multi-currency balances without floating point errors?",a:"NEVER use FLOAT or DOUBLE for money. Store always as BIGINT in the smallest currency unit: USD $10.99 → 1099 cents, INR ₹500.50 → 50050 paise, JPY ¥1000 → 1000 yen (no minor unit). FX conversion: amount_from_minor × fx_rate → round to nearest integer. Display: divide by minor_unit_factor and format with locale-specific decimal formatting. This eliminates all floating-point rounding errors."},{q:"How does the idempotency key protect against double transfers?",a:"Client generates a UUID v4 as idempotency_key for each transfer. Server: SETNX idempotency:{key} EX 86400 → if fails (key exists) → return cached result, no re-processing. DB UNIQUE INDEX on transactions.idempotency_key: even if Redis loses the key, DB rejects the duplicate INSERT. If server crashes after COMMIT but before response → client retries with same key → server finds existing completed transaction → returns that result.",pb:true},{q:"What is the Suspense Account pattern for A/C-to-A/C transfers?",a:"Money in-flight between source wallet and external bank credit must sit somewhere. The Suspense account holds it. Step 1: DEBIT source wallet + CREDIT suspense (atomic). Step 2: submit to IMPS/NEFT. On SUCCESS: DEBIT suspense + CREDIT destination (or bank confirms credit). On FAILURE: DEBIT suspense + CREDIT source back (reversal). At any moment: SUM(all wallets) + SUM(suspense) = constant total funds. Suspense balance near-zero at EOD. Any residual = stuck transaction needing investigation."}]},

hld:`MULTI-LAYER CHECK PIPELINE (fastest → slowest):

  Client → POST /v1/urls/check
  │
  [L0] Rate Limiter (Redis Lua, <1ms)
       Token bucket per API key → 429 if exceeded
  │
  [L1] URL Normalization (<1ms, in-process)
       lowercase hostname, decode %encoding, strip tracking params
       expand shorteners: HEAD request → follow redirects (cache result)
       canonical form: hash = SHA-256(normalized_url)
  │
  [L2] ALLOWLIST check (<0.1ms, in-process small hash map)
       False positive override → SAFE (bypasses Bloom filter)
  │
  [L3] BLOOM FILTER (<0.1ms, 625MB in-process RAM)
       NOT in filter → URL definitely SAFE → return immediately
       IN filter → possibly malicious → check next layer
       Eliminates ~99% of all checks here!
  │
  [L4] Redis Cache (<5ms)
       GET verdict:{url_hash}
       HIT: return cached verdict (MALICIOUS/SAFE/SUSPICIOUS)
       MISS: proceed to DB
  │
  [L5] DB Lookup (<20ms)
       CockroachDB SELECT WHERE url_hash=?
       HIT: cache in Redis, return verdict
       MISS: proceed to ML
  │
  [L6] ML Scorer (<80ms, in-process model)
       XGBoost: domain_age, url_length, lookalike_domain,
       TLD_abuse_rate, hostname_entropy, IP_reputation
       Score > 0.8 → MALICIOUS | 0.5-0.8 → SUSPICIOUS | else → UNKNOWN
       Async: enqueue for sandbox crawler verification

  THREAT INTEL INGESTION (every 5 min):
    VirusTotal/PhishTank feeds → Kafka → Ingestion Workers
    → UPSERT url_verdicts DB
    → DEL verdict:{hash} [Redis cache invalidation]
    → SADD bloom_delta {url_hash} [real-time Bloom update]`,
hldWhy:[["Client-side Bloom filter","99.99% URLs return SAFE locally; no network hop"],["32-bit hash prefix lookup","k-anonymity preserves user privacy"],["Redis prefix index server-side","1ms lookup at 500k QPS"],["Signed update blobs via CDN","fast distribution to billions of clients"],["MySQL source of truth","admin / appeals / audit ACID"],["Why Bloom?","no false negatives (real threats never missed); 1000× fewer network calls"]],
deep:[{name:"Bloom Filter: Why It's Perfect Here",diag:`PROPERTY: Bloom filter can say "DEFINITELY NOT in the set"
  → Zero false negatives (no malicious URL ever missed)
  → ~1% false positives (safe URL occasionally triggers next layer)

WHY PERFECT FOR THIS USE CASE:
  95%+ of URLs checked are SAFE (Google, Amazon, Gmail...)
  These are DEFINITELY NOT in the malicious URL set
  Bloom filter eliminates them in <0.1ms with zero DB cost

For 500M malicious URLs:
  Exact set (Redis Set): 500M × 50B URL = 25 GB RAM (expensive)
  Bloom filter: ~625MB RAM (40× smaller!)
  
  Bloom filter stores SHA-256 HASHES not URLs:
  → Each hash maps to K=7 bit positions in the 625MB array
  → Set all 7 bits when adding a URL
  → Check: if ANY bit is 0 → definitely not in set (SAFE)
  
  Operation at scale:
  115,740 checks/sec → 115,740 × 7 bit lookups = 810K bit reads/sec
  All in 625MB RAM → L1/L2 cache hits → sub-microsecond

  THE CRITICAL INVARIANT:
  A SAFE URL is never returned as MALICIOUS due to Bloom filter
  (False positive → extra Redis/DB check, not a wrong verdict)`,pts:["Bloom filter = L1 cache for 'is this URL definitely not malicious?'","625MB fits in modern server L3 cache → essentially instant","1% false positive = 1,157/sec DB queries from safe URLs (tiny load)","Zero false negatives: safety guarantee — no malicious URL ever classified as SAFE"]},{name:"Keeping Bloom Filter Updated Across 50 Servers",diag:`PROBLEM: New malicious URLs added constantly
  How to update 50 API servers' in-memory Bloom filters
  without downtime or synchronization bottleneck?

TWO-TIER SOLUTION:

TIER 1: Delta Set (real-time, seconds)
  When new malicious URL detected:
    SADD bloom_delta {url_hash}  [Redis Set]
    Expire: EXPIRE bloom_delta {86400}
  
  On check, after Bloom filter miss:
    SISMEMBER bloom_delta {url_hash}
    → Found in delta: MALICIOUS (even before Bloom is updated)
  
  Delta Set grows during the day → flushed on next rebuild

TIER 2: Full Rebuild (daily, 2AM):
  1. Read all malicious URL hashes from CockroachDB
  2. Build fresh Bloom filter in memory (clean state, no stale entries)
  3. Serialize → upload to S3
  4. Each API server polls S3 every 5 min:
     new_version.txt updated? → download → load into RAM
     → atomic pointer swap (old filter → new filter in nanoseconds)
     → old filter GC'd
  5. Clear bloom_delta Redis Set
  
  Result:
  Real-time updates: new URLs in bloom_delta within seconds
  Daily cleanup: fresh Bloom filter, no stale entries accumulating`,pts:["Delta set: real-time bridge between DB update and next Bloom rebuild","Atomic pointer swap: zero-downtime Bloom filter hot reload","Full rebuild removes stale entries (URLs removed from DB but still in Bloom)","S3 as distribution mechanism: pull-based, no push to 50 servers needed"]}],
xq:[{q:"Bloom filter has 1% false positive rate — doesn't this block legitimate sites?",a:"No! False positive on the Bloom filter means the URL gets checked in the NEXT LAYER (Redis → DB) — it does NOT immediately block the URL. For a safe URL that false-positives the Bloom filter: Redis miss → DB miss → URL correctly returned as SAFE. The false positive only adds 5-25ms extra latency (Redis + DB lookup) — it never produces a wrong verdict. The only way a legitimate site gets blocked is if it's incorrectly in the url_verdicts DB — that's a data quality issue, fixable via the allowlist."},{q:"How do you handle URL shorteners like bit.ly?",a:"Before hashing the URL: HEAD request with redirect following to resolve the final destination. Cache expanded URL: Redis SET expanded:{short_url} {final_url} EX 3600 (1hr TTL). Check final destination URL against Bloom filter. Why cache? Same bit.ly link checked millions of times → cache hit = zero network hop for expansion. Rate limiting on expansion: max 5 expansions/second per shortener domain to avoid getting blocked. Both the short URL AND expanded URL checked against the DB for defense in depth.",pb:true},{q:"How does the system detect lookalike/homograph attacks (paypa1.com, pаypal.com)?",a:"Two checks: (1) Levenshtein distance: compute edit distance between URL's domain and top-1000 brand domains. Distance ≤ 2 = lookalike alert. (2) Unicode homograph: convert all characters to ASCII equivalents ('а' Cyrillic → 'a' Latin) using Unicode confusable mapping. If normalized form matches a known legitimate domain → flag as phishing. These checks run in the ML feature extraction step (L6) — O(1000 comparisons) per URL, fast enough in <80ms total budget."},{q:"How do you scale to 115,740 checks/second?",a:"Layer-by-layer analysis: L0-L2 (rate limit + normalize + allowlist): in-process, handles all 115K/s. L3 (Bloom filter): in-process 625MB RAM → eliminates ~99% → only ~1,157/s reach L4. L4 (Redis): handles 1,157/s trivially (Redis does 1M ops/s). L5 (DB): sees only cache misses (~116/s at 90% cache hit). L6 (ML): only truly unknown URLs. 50 stateless API servers × 2,300 req/s each = 115K/s total. Scale horizontally: each server holds a full copy of Bloom filter from S3."}]},
