<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Interview Quick Ref</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bd:#30363d;--bl:#58a6ff;--gr:#3fb950;--or:#ffa657;--pu:#d2a8ff;--rd:#f78166;--yl:#e3b341;--tx:#e6edf3;--t2:#8b949e;--t3:#c9d1d9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.55;overflow-x:hidden;width:100%}
/* PROBLEM SELECTOR */
#psel{position:sticky;top:0;z-index:200;background:rgba(13,17,23,.97);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}
#psel::-webkit-scrollbar{display:none}
.pp{flex-shrink:0;padding:5px 11px;border-radius:16px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.pp.on{background:var(--bl);border-color:var(--bl);color:#000}
/* PHASE TABS */
#ptabs{position:sticky;top:41px;z-index:199;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;gap:2px;padding:6px 8px;scrollbar-width:none}
#ptabs::-webkit-scrollbar{display:none}
.pt{flex-shrink:0;padding:6px 12px;border-radius:6px;border:none;background:transparent;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.pt.on{background:var(--bl);color:#000}
/* CONTENT */
#content{padding:12px}
/* SECTION */
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--bl);margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.sec-title:first-child{margin-top:0}
/* REQ LISTS */
ul.rlist{list-style:none;padding:0}
ul.rlist li{padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px;color:var(--t3);line-height:1.4}
ul.rlist li:last-child{border-bottom:none}
ul.rlist li::before{content:"→ ";color:var(--bl);font-weight:700}
ul.rlist.nfn li::before{color:var(--or)}
ul.rlist.ask li{color:var(--yl)}
ul.rlist.ask li::before{content:"? ";color:var(--yl)}
/* EST TABLE */
.est-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.est{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
table.est th{background:var(--bg3);color:var(--t2);padding:7px 8px;text-align:left;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--bd)}
table.est td{padding:7px 8px;border-bottom:1px solid var(--bd);color:var(--t3);vertical-align:top}
table.est td.v{color:var(--bl);font-family:monospace;font-weight:700;white-space:nowrap}
table.est td.d{color:var(--gr);font-size:11px}
table.est tr:last-child td{border-bottom:none}
/* ENTITY */
.entity{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}
.entity-name{background:var(--bg3);padding:7px 12px;font-size:12px;font-weight:700;color:var(--pu);border-bottom:1px solid var(--bd)}
.entity-body{padding:10px 12px}
.field-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd);font-size:12px;align-items:flex-start}
.field-row:last-child{border-bottom:none}
.field-name{color:var(--bl);font-family:monospace;flex-shrink:0;min-width:120px}
.field-type{color:var(--t2);font-size:11px}
.idx-row{margin-top:8px;font-size:11px;color:var(--or);padding:5px 8px;background:rgba(255,166,87,.07);border-radius:4px}
/* API */
.api-card{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}
.api-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--bd)}
.method{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:800;flex-shrink:0}
.m-get{background:#0d2818;color:var(--gr)}
.m-post{background:#1f3a5f;color:var(--bl)}
.m-put{background:#3d2a00;color:var(--or)}
.m-del{background:#3d1313;color:var(--rd)}
.m-pat{background:#2a1a4e;color:var(--pu)}
.api-path{font-family:monospace;font-size:13px;color:var(--tx);flex:1}
.api-desc{font-size:11px;color:var(--t2)}
.api-body{padding:10px 12px}
.api-label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t2);margin-bottom:3px;letter-spacing:.5px}
.api-code{font-family:monospace;font-size:11px;color:var(--t3);background:var(--bg3);padding:6px 8px;border-radius:4px;margin-bottom:8px;overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch}
.api-codes{font-size:11px;color:var(--t2)}
.api-codes span{margin-right:8px;color:var(--or)}
/* HLD */
.hld-box{font-family:'SF Mono','Fira Code',monospace;font-size:11px;line-height:1.8;color:var(--t3);background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch}
/* WHY THESE CHOICES (under HLD) */
.why-list{display:flex;flex-direction:column;gap:5px;margin:4px 0 14px}
.why-row{display:flex;flex-wrap:wrap;gap:8px;padding:7px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:6px;font-size:12px;line-height:1.45;align-items:flex-start}
.why-c{color:var(--bl);font-weight:700;flex-shrink:0;min-width:88px;font-family:'SF Mono',monospace;font-size:11px}
.why-txt{color:var(--t3);flex:1;min-width:0;word-break:break-word}
.sub-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--or);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--bd)}
/* DEEP DIVES */
.deep-card{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}
.deep-header{padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.deep-header:active{background:rgba(88,166,255,.06)}
.deep-title{font-size:13px;font-weight:700;color:var(--bl)}
.deep-chev{color:var(--t2);font-size:13px;transition:transform .25s}
.deep-card.open .deep-chev{transform:rotate(180deg)}
.deep-body{display:none;border-top:1px solid var(--bd);padding:12px}
.deep-card.open .deep-body{display:block}
.deep-diag{font-family:monospace;font-size:11px;line-height:1.7;color:var(--t3);background:var(--bg3);padding:10px;border-radius:6px;overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch;margin-bottom:10px}
.deep-pts{list-style:none;padding:0}
.deep-pts li{font-size:13px;color:var(--t3);padding:4px 0;border-bottom:1px solid var(--bd);line-height:1.4}
.deep-pts li:last-child{border-bottom:none}
.deep-pts li::before{content:"• ";color:var(--or);font-weight:700}
/* CROSS Q */
.xq-item{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;overflow:hidden}
.xq-q{padding:10px 12px;cursor:pointer;font-size:13px;color:var(--or);font-weight:600;user-select:none;display:flex;align-items:flex-start;gap:8px}
.xq-q:active{background:rgba(255,166,87,.07)}
.xq-qtag{background:#3d2a00;color:var(--or);padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.xq-a{display:none;padding:10px 12px;border-top:1px solid var(--bd);font-size:13px;color:var(--t3);line-height:1.5;background:rgba(63,185,80,.04)}
.xq-a::before{content:"A → ";color:var(--gr);font-weight:700}
.xq-item.open .xq-a{display:block}
/* PUSHBACK (special XQ) */
.xq-item.pushback{border-left:3px solid var(--rd)}
.xq-item.pushback .xq-q{color:var(--rd)}
.xq-item.pushback .xq-qtag{background:#3d1313;color:var(--rd)}
/* PILL STACK */
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.pill{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(88,166,255,.12);color:var(--bl);border:1px solid rgba(88,166,255,.25)}
.pill.g{background:rgba(63,185,80,.12);color:var(--gr);border-color:rgba(63,185,80,.25)}
.pill.o{background:rgba(255,166,87,.12);color:var(--or);border-color:rgba(255,166,87,.25)}
.pill.r{background:rgba(247,129,102,.12);color:var(--rd);border-color:rgba(247,129,102,.25)}
/* HIGHLIGHT */
.hbox{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--t3);margin:6px 0}
.hbox strong{color:var(--bl)}
.warn{background:rgba(247,129,102,.08);border-color:rgba(247,129,102,.25)}
.warn strong{color:var(--rd)}
b.bl{color:var(--bl)} b.gr{color:var(--gr)} b.or{color:var(--or)} b.pu{color:var(--pu)} b.rd{color:var(--rd)} b.yl{color:var(--yl)}
</style>
</head>
<body>

  <button class="pt on" data-phase="req">📋 Req</button>

  <button class="pt" data-phase="deep">🔍 Deep</button>
  <button class="pt" data-phase="xq">❓ Cross Q</button>
</div>
<div id="content"></div>

{id:1,name:"URL Shortener",short:"URL Short",diff:"med",

est:[{m:"DAU",f:"given",v:"100M",d:"baseline scale"},{m:"Creators (10% of DAU)",f:"100M × 10%",v:"10M",d:"only creators trigger writes; 90% are pure consumers"},{m:"URLs created/day",f:"10M × 10/day",v:"100M",d:"per-creator power user volume"},{m:"Writes/sec",f:"100M / 100k",v:"~1k/s",d:"MySQL handles easily — light sharding"},{m:"Reads/sec",f:"10B / 100k",v:"~100k/s",d:"Redis cache mandatory — 80% hit rate = DB sees ~20k/s"},{m:"Storage (5yr)",f:"50 GB/day × 365 × 5",v:"~91 TB",d:"Shard MySQL by short_key hash or use DynamoDB"},{m:"Cache RAM (hot 20%)",f:"400M URLs × 500B",v:"~200 GB",d:"Redis cluster (8 shards × 25 GB)"},{m:"Read bandwidth",f:"100k/s × 500B",v:"~50 MB/s",d:"Modest; CDN nice-to-have"},{m:"Key space",f:"62^7 = 3.5 trillion",v:"7-char base62",d:"~96 years at 100M/day"}],
model:[{name:"urls",fields:[["short_key","VARCHAR(8) PRIMARY KEY"],["long_url","TEXT NOT NULL"],["user_id","UUID (nullable — anonymous allowed)"],["created_at","TIMESTAMPTZ DEFAULT NOW()"],["expires_at","TIMESTAMPTZ (NULL = never expires)"],["status","ENUM(ACTIVE, EXPIRED, DELETED) DEFAULT ACTIVE"],["click_count","BIGINT DEFAULT 0"]],idx:["CREATE INDEX idx_expires ON urls(expires_at) WHERE status='ACTIVE'","CREATE INDEX idx_user ON urls(user_id)"]},{name:"users",fields:[["user_id","UUID PRIMARY KEY DEFAULT gen_random_uuid()"],["email","VARCHAR(255) UNIQUE NOT NULL"],["api_key","VARCHAR(64) UNIQUE NOT NULL"],["rate_limit_tier","SMALLINT DEFAULT 1"],["created_at","TIMESTAMPTZ DEFAULT NOW()"]],idx:["CREATE UNIQUE INDEX idx_api_key ON users(api_key)"]},{name:"key_pool (KGS Redis list)",fields:[["key_pool_ready","Redis LIST — pre-generated 7-char base62 keys"],["key_pool_size","target: 10M keys pre-loaded"],["refill_threshold","trigger KGS refill when size < 1M"]],idx:["LPOP = O(1) atomic key assignment","KGS marks keys USED in MySQL before loading to Redis"]}],
apis:[{m:"POST",p:"/api/v1/urls",auth:"API key (header)",desc:"Create a short URL",req:'{\n  "long_url": "https://example.com/...",\n  "custom_alias": "mylink",   // optional\n  "ttl_hours": 24             // optional, null=never\n}',res:'{\n  "short_url": "https://bit.ly/abc1234",\n  "short_key": "abc1234",\n  "long_url": "https://example.com/...",\n  "expires_at": "2024-02-01T00:00:00Z"\n}',codes:"201 Created | 409 Alias taken | 422 Invalid URL | 429 Rate limit exceeded"},{m:"GET",p:"/{short_key}",auth:"None (public)",desc:"Redirect to original long URL",req:"(no body)",res:"HTTP 302 Location: {long_url}\nX-Short-Key: abc1234\nCache-Control: no-store  // 302=no browser cache",codes:"302 Redirect | 404 Key not found | 410 URL expired/deleted"},{m:"DELETE",p:"/api/v1/urls/{short_key}",auth:"API key (must be owner)",desc:"Delete a short URL",req:"(no body)",res:'{ "deleted": true, "short_key": "abc1234" }',codes:"200 OK | 403 Forbidden (not owner) | 404 Not found"},{m:"GET",p:"/api/v1/urls/{short_key}/analytics",auth:"API key (owner)",desc:"Get click analytics for a URL",req:"Query: ?from=2024-01-01&to=2024-01-31&granularity=day",res:'{\n  "total_clicks": 54200,\n  "unique_visitors": 41000,\n  "timeline": [{"date":"2024-01-01","clicks":320},...],\n  "geo": [{"country":"IN","clicks":30000},...],\n  "referrers": [{"domain":"google.com","clicks":12000},...]\n}',codes:"200 OK | 403 Forbidden | 404 Not found"}],
hld:`┌──────────────────────────────────────────────────────┐
│                   CLIENT (Browser/App)                │
└──────────────────────┬───────────────────────────────┘
                       │
              ┌────────▼────────┐
              │  Load Balancer  │  (L7 — path-based routing)
              └──┬──────────┬───┘
                 │          │

    │  URL Service  │   │ Redirect Service │
    │  (writes)     │   │ (reads — 100k/s) │
    └───────┬───────┘   └────┬────────────┘
            │                │
            │    ┌───────────▼──────┐
            │    │  Redis Cluster   │ ← L1 Cache (~80% hit)
            │    │  url:{key}→url   │
            │    └───────────┬──────┘
            │                │ cache miss
    ┌───────▼────────────────▼──────┐
    │   MySQL (Primary + Replicas)  │
    │   Sharded by short_key hash   │
    └───────────────────────────────┘
            │
    ┌───────▼──────┐    ┌─────────────┐
    │ KGS Service  │    │   Kafka     │
    │ Redis LIST   │    │ click events│
    │ key_pool     │    └──────┬──────┘

                       └──────────────┘`,
hldWhy:[["MySQL","ACID URL records; sharded by short_key for write scale"],["Redis cache","80% hit rate cuts DB reads 5×; sub-ms redirect lookup"],["KGS + LIST","atomic LPOP gives collision-free key assignment"],["Kafka","async click events — never blocks the 302 redirect"],["ClickHouse","columnar — billions of click events queryable in ms"],["Why not NoSQL?","URLs are relational with low cardinality; PG/MySQL is right fit"]],
deep:[{name:"KGS — Key Generation Service",diag:`KGS Worker (background, runs continuously):
  1. SELECT key_value FROM key_pool
       WHERE status='UNUSED' LIMIT 5000
       FOR UPDATE SKIP LOCKED;
  2. UPDATE key_pool SET status='USED'
       WHERE key_value IN (...);    ← commit to MySQL first (crash-safe)
  3. RPUSH key_pool_ready k1 k2...  ← load to Redis

URL Service (on each create):
  key = LPOP key_pool_ready         ← O(1), atomic
  if nil: trigger KGS refill immediately
  INSERT urls SET short_key=key, ...`,pts:["Pre-generate → zero collision at assignment time","LPOP is atomic — 2 concurrent creates never get the same key","Keys committed to MySQL (USED) before Redis load → safe on crash","2 KGS instances for HA — each loads different batches"]},{name:"Caching Strategy",diag:`READ path (GET /{key}):
  Redis GET url:{key}   [TTL = URL's expires_at]
    HIT  → 302 redirect immediately (<1ms)
    MISS → MySQL SELECT WHERE short_key=key
           if found → SET url:{key} EX {ttl_secs}
           → 302 redirect

TTL management:
  URL expires_at = 2024-03-01
  Redis TTL = seconds until 2024-03-01
  → Redis auto-expires key with URL → no manual cleanup
  
  URL deleted → DEL url:{key} immediately
  URL expiry check at read time (defense in depth)`,pts:["Redis TTL matches URL TTL → no manual cache invalidation for expiry","Explicit DEL needed only for manual deletions","Cluster: 16 shards handles 116K reads/s","On Redis miss: DB read + cache SET (cache-aside pattern)"]},{name:"Analytics Pipeline",diag:`On redirect (NEVER block for analytics):

  { key, ts, ip, user_agent, referer, country }

  → Redis HGET click:{key} for total count
  → ClickHouse SELECT for time-series / geo breakdown`,pts:["Kafka decouples redirect path from analytics — zero latency impact","ClickHouse columnar storage: analytics queries in milliseconds","Redis INCR for real-time count without hitting ClickHouse","MaxMind DB loaded in-process — no network hop for geo-IP"]}],
xq:[{q:"How do you handle hash collisions in key generation?",a:"KGS pre-generates keys uniquely offline and marks them USED in MySQL before loading to Redis. When URL Service does LPOP, the key is already committed as USED. Zero possibility of two URLs getting the same key. Unlike MD5-of-URL which can produce same hash for different inputs."},{q:"How do you scale reads to 116K RPS?",a:"Redis cluster (16 shards) handles this comfortably at ~1M ops/sec total. 80% cache hit rate means DB sees only ~23K reads/sec — trivial for MySQL read replicas. For even higher scale: CDN can cache 301 redirects at edge (browser caches permanently, trades analytics for performance)."},{q:"Why 302 redirect instead of 301?",a:"302 = Temporary: browser hits server on every request → we see every click → accurate analytics. 301 = Permanent: browser caches redirect locally → repeat visits never reach our server → analytics miss them. Use 302 when analytics matter (Bit.ly), 301 when performance matters more."},{q:"Custom aliases — implementation?",a:"Before assigning: SELECT FROM urls WHERE short_key=alias. If exists → 409. If free → INSERT directly (bypass KGS key pool). Enforce minimum length of 6 chars to protect KGS keyspace. Add profanity filter + reserved words list (api, www, admin, etc)."},{q:"What if KGS crashes mid-operation?",a:"KGS first commits keys as USED in MySQL, then loads to Redis. If crash between those steps: keys are USED in MySQL but not in Redis — they become orphaned. Recovery: on restart, KGS checks Redis pool size; if below threshold, loads from MySQL. Orphaned keys are a minor waste but no correctness issue.",pb:true},{q:"How do you handle URL expiry precisely?",a:"Two-layer: (1) Redis TTL = seconds until expires_at — Redis auto-deletes the cache key. (2) At redirect time, check expires_at from DB → return 410 Gone if expired (defense in depth). Background job runs daily sweeping expired URLs from MySQL for storage reclamation and returning keys to pool."}]},

deep:[{name:"Hybrid Fan-Out: Push vs Pull vs Celebrity",diag:`PUSH (fan-out on write) — regular users (<1M followers):
  On tweet: fan-out workers push tweet_id to
  EVERY follower's Redis ZADD timeline
  → Read is instant (O(log N) ZREVRANGE)
  → Problem: 100M followers × 1,160 tweets/s = 116B writes/s

PULL (fan-out on read) — celebrities (≥1M followers):
  NO push on tweet creation
  On timeline read: SELECT tweet_id FROM tweets
    WHERE user_id IN (celebrity_follows)
    ORDER BY tweet_id DESC LIMIT 20
  → Problem: slow reads, high DB load at read time

HYBRID (Twitter's actual approach):
  Read timeline = merge(pushed_cache + pulled_celebrity_tweets)
  Step 1: ZREVRANGE user:timeline:{uid} 0 19  (pushed)
  Step 2: for each celebrity followed:
            ZREVRANGE celeb:tweets:{celeb_id} 0 4
  Step 3: merge, sort by timestamp, return top 20`,pts:["Threshold (1M followers) marks celebrity mode — configurable","On follow: async backfill last 20 tweets from new followee into timeline","Timeline cache max 800 tweets → older data falls back to DB","Celebrity tweet IDs cached in separate ZSET for fast pull"]},{name:"Feed Ranking Algorithm",diag:`Ranked feed signals (ML model, run at read time):
  1. Affinity score: how often you engage with this author?
     → (likes + retweets + replies) in last 30 days
  2. Content score: topic match to your interests
     → from embedding similarity (offline computed)
  3. Recency decay: older tweets score lower
     → score × e^(-λ × hours_old)
  4. Engagement velocity: trending tweet
     → (likes_per_hour / followers) in last 1h

Final score = w1×affinity + w2×content + w3×recency + w4×velocity
Scores pre-computed for top 800 tweets in cache
Re-ranked at read time (adds ~20ms but improves relevance)`,pts:["Pre-fetching 800 tweets and ranking at read is faster than fetching on demand","Affinity scores computed offline (Spark job, hourly)","Recency decay prevents stale tweets from staying at top","A/B test weights to optimise engagement metrics"]},{name:"Trending Topics",diag:`Kafka consumer: on each tweet, extract hashtags
  → ZINCRBY trending:global {score} {hashtag}
     score = 1 + (is_retweet ? 0.5 : 0) + (has_media ? 0.3 : 0)
  → Using sliding window (Flink, 1-hour window)
  → EXPIRE key at window end

Top-N query:
  ZREVRANGE trending:global 0 9 WITHSCORES
  → cache result for 60 seconds (same result for all users)
  → personalized: remove hashtags user already saw today`,pts:["Redis ZINCRBY is atomic — safe for concurrent updates","60s cache prevents per-user computation (same for everyone)","Geo-specific trending: ZINCRBY trending:{country} separately","Flink sliding window: decay score over time, not just count"]}],
xq:[{q:"How do you handle a celebrity (100M followers) posting a tweet?",a:"Skip the push fan-out entirely for celebrity accounts (>1M followers). Store their tweet IDs in a separate Redis ZSET: celeb:tweets:{id}. At timeline read time, merge celebrity tweets (pulled fresh) with the pushed timeline cache. This bounds fan-out cost to manageable levels while keeping reads fast."},{q:"What's the latency breakdown for timeline load?",a:"ZREVRANGE from Redis: 1-2ms. Hydrating 20 tweet objects (Redis hash): 5ms. Celebrity tweet pull (2-3 celebs): 5ms. Ranking/merge: 3ms. Total: ~15-20ms — well within 200ms SLA. Without Redis (DB-only): 200-500ms easily."},{q:"How does a user see their new tweet immediately after posting?",a:"Optimistic UI: client displays the tweet locally before server confirms. On server confirm, the tweet is also added to the poster's own timeline cache. Read-your-own-writes consistency achieved by routing the poster's next timeline read to the primary DB (not replicas) for 1 minute after posting."},{q:"How do you implement infinite scroll / pagination?",a:"Cursor-based pagination using tweet_id as cursor (Snowflake ID is time-ordered). Response includes next_cursor = last tweet_id in the batch. Next request sends ?cursor={tweet_id} → ZRANGEBYSCORE user:timeline below that ID. Avoids OFFSET which is O(n) — cursor is O(log n) on sorted set."},{q:"Timeline is stale after following someone new — how to fix?",a:"Async backfill: after follow event, Fan-Out Service inserts the last 20 tweets from the new followee into the follower's timeline ZSET. This completes within seconds. Until backfill, the timeline shows slightly stale content — acceptable eventual consistency for social feeds.",pb:true}]},

deep:[{name:"Message Routing: Online vs Offline",diag:`ONLINE recipient (same server):
  Sender → Chat Server A → WS push → Recipient
  Update: Cassandra msg status = DELIVERED
  Receipt: Recipient ACK → Server → Kafka → Sender server
           → WS push ✓✓ to sender

ONLINE but different server:
  Chat Server A receives msg
  → Redis GET user:{recipient_id}:server → "chat-server-B"
  → Direct gRPC call to Chat Server B → WS push
  (Intra-cluster communication, same DC, <1ms)

OFFLINE recipient:
  Kafka retains message (7-day retention)
  When recipient reconnects:
    Client sends {last_received_msg_id}
    Server: SELECT FROM messages
      WHERE chat_id=? AND msg_id > last_received
    Push all pending messages in order`,pts:["Redis maps each user_id to their current WS server address","Kafka is the durability buffer for offline messages","Offline messages limited: server caps queue at 1000 unread msgs","On WS disconnect: set user:{id}:server to empty, TTL presence key"]},{name:"Cassandra Schema & Query Patterns",diag:`Table: messages
  Partition key: chat_id
  Clustering key: msg_id (TIMEUUID, DESC)

Why this schema:
  All messages for a chat → same partition → same node
  TIMEUUID → time-ordered without global coordinator
  DESC clustering → latest messages returned first

Queries served:
  Load last 50 msgs: SELECT WHERE chat_id=? LIMIT 50  [O(1)]
  Pagination: SELECT WHERE chat_id=? AND msg_id < cursor LIMIT 50  [O(1)]
  
What you CAN'T do (avoid in design):
  Search by sender_id → ALLOW FILTERING = full scan (don't do it)
  Get all chats for a user → separate user_chats table`,pts:["Cassandra LSM-Tree: writes go to MemTable first (in-memory) → never random disk I/O","TIMEUUID generated by Snowflake service (no coordination needed)","Each chat's messages physically co-located on same Cassandra node","Replication factor 3 + quorum reads → strong consistency for message ordering"]},{name:"E2EE — Signal Protocol (High Level)",diag:`Key Setup (once per device):
  Client generates: Identity Key (Ed25519)
                    Signed Prekey (X25519, rotated weekly)
                    One-time Prekeys (batch of 100, X25519)
  Upload public keys to WhatsApp server
  Server stores ONLY public keys

First message (X3DH key exchange):
  Sender fetches recipient's public keys from server
  Derives shared secret (without any server involvement)
  Encrypts message with AES-256-GCM
  Server receives: encrypted blob + key exchange metadata
  Server CANNOT decrypt — only recipient's private key can

Ongoing messages (Double Ratchet):
  Each message shifts the ratchet → new encryption key
  Forward secrecy: past keys deleted → past msgs safe even if
                   current key is compromised`,pts:["Server stores only public keys — physically cannot decrypt messages","Each message has a unique key (Double Ratchet) — compromise of one doesn't expose others","Key exchange happens client-to-client — server is just a relay","Media: encrypted on device, uploaded to S3, URL shared in message"]}],
xq:[{q:"How does message ordering work across distributed chat servers?",a:"TIMEUUID as message ID incorporates a timestamp + random component — generated by Snowflake service. Cassandra's clustering by TIMEUUID DESC means messages are naturally sorted. For concurrent messages at exact same millisecond, the random component ensures uniqueness. Client uses server-assigned msg_id for display ordering, never client timestamps."},{q:"What happens if a Chat Server crashes while serving 100K users?",a:"WebSocket connections drop. Clients detect disconnect and reconnect (exponential backoff: 1s, 2s, 4s...). Load balancer consistent hash may route them to a different server. New server: no state lost — messages are in Cassandra, presence is in Redis. Clients send {last_received_msg_id} on reconnect — server pushes all pending messages."},{q:"How do you scale group chat to 512 members?",a:"For small groups (≤200): synchronous fan-out — write message to each member's notification queue inline. For large groups (200-512): async fan-out via Kafka — a dedicated consumer reads group membership from Redis Set and queues delivery to each member. Group membership cached in Redis Set: SMEMBERS group:{id}:members.",pb:true},{q:"Why Cassandra over MySQL for messages?",a:"100B messages/day = 1.16M writes/second. MySQL handles ~5-10K writes/sec. Cassandra with LSM-Tree architecture handles 100K+ writes/sec per node. Additionally, the natural access pattern (all messages for a chat = one partition) maps perfectly to Cassandra's partition model. MySQL JOINs and indexes would add overhead we don't need for simple chat history."},{q:"How does E2EE work when the recipient has multiple devices?",a:"Each device has its own key pair. Sender encrypts the message separately for each of recipient's devices (multiple X3DH sessions). Server forwards each encrypted copy to the appropriate device. This is why WhatsApp Web and phone can both show the same message — each independently decrypts its own copy."}]},

deep:[{name:"Transcoding Pipeline",diag:`Raw video → S3 raw bucket
                ↓ (Kafka trigger)
    Segmenter: ffprobe duration → split into N 5-min segments
                ↓ (N parallel Kafka messages)
    Transcoder Workers (one per segment per quality):
      ffmpeg -i segment.mp4 -vf scale=1280:720 -c:v libx264 \
             -b:v 2500k -hls_time 2 -hls_list_size 0 out.m3u8
                ↓
    S3: videos/{video_id}/720p/seg001_001.ts
        videos/{video_id}/720p/seg001_002.ts
        ...
    MySQL: video_segments INSERT batch
                ↓
    Manifest Generator: combine all segments into master.m3u8
    CDN: pre-warm popular videos at edge nodes
    Notify creator: video PUBLISHED`,pts:["Parallel per-segment transcoding: 60-min video done in 5-min wall time","Workers scale with SQS queue depth (target: 10 msgs/worker)","HLS chunks (2s) enable precise seeking without full file load","Audio transcoded separately (AAC), muxed in final step"]},{name:"Adaptive Bitrate (ABR) Streaming",diag:`m3u8 Master Manifest:
  #EXT-X-STREAM-INF:BANDWIDTH=500000,RESOLUTION=640x360
  360p/playlist.m3u8
  #EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1280x720
  720p/playlist.m3u8
  #EXT-X-STREAM-INF:BANDWIDTH=6000000,RESOLUTION=1920x1080
  1080p/playlist.m3u8

Player ABR algorithm:
  • Measure download speed of last 3 chunks
  • If chunk downloaded in < 0.5× chunk_duration → upgrade quality
  • If chunk downloaded in > 2× chunk_duration → downgrade quality
  • Maintain 30s buffer ahead
  • Report buffer occupancy to server → analytics

CDN Strategy:
  Top 5% videos: pre-warm ALL edge nodes (pushed CDN)
  Long-tail 95%: pull CDN (fetch from S3 on first request per edge)`,pts:["2-second chunks = smooth quality transitions without re-buffering","Buffer target 30s: resilient to 30s of poor connectivity","CDN pre-warming runs based on ML predictions of next-hour popular videos","DASH (ISO standard) used alongside HLS for Android/Chrome compatibility"]},{name:"View Count at Scale (57,870/s)",diag:`PROBLEM: 57,870/s UPDATE view_count → MySQL can't handle

SOLUTION: Redis buffer + batch flush

On each view:
  1. Kafka "view-events" (video_id, user_id, ts, duration_pct)
  2. View Aggregator (Kafka consumer):
       INCR redis:views:{video_id}  [atomic, ~1M ops/s]
  3. Batch flush every 60s:
       Redis GETDEL redis:views:{video_id} → delta
       UPDATE videos SET view_count = view_count + delta
  
Watch time analytics:
  Kafka → ClickHouse (columnar)
  Queries: avg watch %, drop-off at 2:30, etc.

Unique viewer count (HyperLogLog):
  PFADD views:unique:{video_id} {user_id}
  → 12KB memory, ±0.81% accuracy for billions of users`,pts:["Redis INCR is O(1) and atomic — handles 57K/s trivially","60s batch flush reduces MySQL writes from 57,870/s to ~58 videos/s","HyperLogLog: count 1B unique viewers in 12KB (exact would need 8GB)","Watch time in ClickHouse: supports analytics queries in <100ms"]}],
xq:[{q:"How does adaptive bitrate (ABR) decide which quality to serve?",a:"Player maintains a sliding window of last 3 chunk download times. If each 2s chunk downloads in <1s → bandwidth is good → try upgrading quality. If chunk takes >4s to download → degrading → immediately downgrade quality. Target: always keep 30-second buffer filled. Quality switches happen between chunk boundaries — seamless to viewer."},{q:"How do you handle a video upload of 10GB?",a:"S3 multipart upload: client splits file into 100MB chunks, uploads each independently. Server tracks received parts via Redis progress key: HSET upload:{video_id} part_num true. On all parts received → S3 CompleteMultipartUpload. TUS protocol adds resumability: client can pause/resume, server identifies missing parts. Each chunk has a 24h TTL for abandoned upload cleanup."},{q:"How would you implement YouTube Shorts / Reels?",a:"Same pipeline, different constraints: max 60s, vertical (9:16) aspect ratio. Transcoding simpler (fewer quality tiers, shorter duration). Key difference: Shorts feed is ML-ranked not follow-graph based (same as TikTok). Pre-fetch next 3 shorts in background for instant playback. Short segments (1s HLS) for fast-forward/scrub behavior.",pb:true},{q:"How do you implement copyright detection?",a:"During transcoding: compute perceptual hash (pHash) of every 5th keyframe. Audio: Chromaprint fingerprint. Store in ContentID DB (fingerprint → rights holder). On new upload: batch comparison against ContentID DB. Match → automated action (block/monetize/track) without human review. ~90% of copyright claims handled automatically."},{q:"What happens when CDN is missing a video segment?",a:"CDN miss → CDN fetches from S3 origin → caches at edge → returns to viewer. S3 has 11-nines durability — origin is always the source of truth. For very long-tail videos rarely watched, the segment may not be at any CDN edge. First viewer in a region experiences cold cache (slightly higher latency). Subsequent viewers in same region get CDN hit."}]},

hld:`DRIVER LOCATION UPDATES (200,000/s):
  Driver App → WebSocket → Location Service
    → Redis GEOADD drivers:available {lng} {lat} {driver_id}
    → Redis HSET driver:{id} status available, ts {now}
    → Kafka "driver-locations" (async, for history + ML)

RIDE MATCHING (<1 second):
  Rider → API Gateway → Trip Service
    1. INSERT trip (status=REQUESTED)   [MySQL, ACID]
    2. Redis GEORADIUS: find 20 nearest available drivers
    3. Filter: vehicle type, rating, active trips
    4. Rank: by ETA (Google Maps API or internal routing)
    5. Redis SETNX driver:{id}:lock {trip_id} EX 15
       → if fails: driver already offered another trip
    6. Push offer to Driver via WebSocket (15s timeout)
    7. If accept: UPDATE trip status=ACCEPTED [MySQL]
                  Release other drivers' locks
    8. If decline/timeout: try next ranked driver

REAL-TIME TRACKING:
  Driver GPS (5s) → Kafka "driver-locations"
    → Notification Service
    → WebSocket → Rider app (map update)

SURGE PRICING:
  Monitor requests/available_drivers ratio per geohash cell
  Every 30s → if ratio > threshold → Redis SET surge:{cell} 1.5
  Applied to new trip price at request time`,

deep:[{name:"Driver Matching & Offer Cascade",diag:`Rider requests → Trip Service:
  Step 1: GEORADIUS drivers:available 5km → [d1,d2,d3...d20]
  Step 2: Filter each driver:
    HGET driver:{id} → vehicle_type, rating, active_trip
  Step 3: ETA estimation for top 10 candidates:
    Haversine distance / avg_speed_in_cell (from Kafka aggregation)
    (Full routing API only after match for accuracy)
  Step 4: Sort by ETA, take top 3

  Offer cascade:
  Offer to Driver 1:
    SETNX driver:{d1}:lock {trip_id} EX 15
    → success: WS push offer to Driver 1
    → Driver 1 has 15s to respond
    
  If decline / timeout:
    DEL driver:{d1}:lock
    Offer to Driver 2 (same process)
    Expand radius to 7km if all 20 exhausted
    Max 3 rounds → "no drivers available"`,pts:["Redis SETNX prevents same driver getting two offers simultaneously","Lock TTL=15s ensures driver is released if app crashes","Radius expansion: 2km → 5km → 10km on exhaustion","Driver acceptance rate tracked — frequent decliners ranked lower"]},{name:"Location Updates at Scale (200K/s)",diag:`Driver App sends GPS every 5 seconds
  → WebSocket → Location Service (stateless fleet)

Location Service:
  1. Update Redis GEO (for real-time matching):
     GEOADD drivers:available {lng} {lat} {driver_id}
     [But batch: collect 100ms of updates → pipeline to Redis]
  2. Update Redis HASH (driver metadata):
     HSET driver:{id} lat {lat} lng {lng} ts {now}
     EXPIRE driver:{id}:loc 15  ← auto-removes stale drivers
  3. Publish to Kafka (async, for history/ML):
     { driver_id, lat, lng, speed, heading, ts }

Kafka → ClickHouse:
  Historical location for analytics, route replay, disputes

Why not PostgreSQL for live locations?
  200K writes/sec >> PG's 10K/s capacity
  In-memory Redis handles 1M ops/sec easily
  No need for persistence of real-time location`,pts:["Batch Redis pipeline: 100ms window → reduce from 200K individual calls to 2K batches","15s TTL on driver location: if driver goes offline → auto-removed from available pool","Kafka for history: GPS trail stored in Cassandra via consumer","Separate Redis cluster for driver locations (don't mix with other Redis data)"]}],
xq:[{q:"How do you prevent two riders from being matched to the same driver?",a:"Redis SETNX (SET if Not eXists) on driver:{id}:lock before sending offer. Only one trip can acquire the lock. If Trip Service A and Trip Service B both try to offer the same driver simultaneously, only one SETNX succeeds. The other gets nil response and moves to next driver. Lock TTL=15s auto-releases if driver doesn't respond."},{q:"How does ETA calculation work at scale?",a:"For matching (speed, ~1ms): Haversine straight-line distance ÷ average vehicle speed in that geohash cell (computed from last 5 min of completed trips). For display to rider (accuracy, ~100ms): Google Maps API call with real-time traffic. Cache Maps API results for common routes (1-minute TTL). Never use Maps API in the matching hot path — too slow and expensive."},{q:"How do you implement surge pricing?",a:"Flink stream processor monitors supply/demand ratio per geohash cell every 30 seconds. Ratio = active_requests / available_drivers. Thresholds: >2 = 1.5×, >3 = 2×, >5 = 3×. Store surge multiplier per cell in Redis. Applied at trip creation time — rider sees the surge price before requesting. Heat map pushed to driver app to incentivize movement.",pb:true},{q:"What happens if the Trip Service crashes mid-matching?",a:"Trip state is in MySQL (ACID). Trip remains in REQUESTED status. Driver locks in Redis have 15s TTL — auto-released. On service recovery: a reconciliation job sweeps trips stuck in REQUESTED for >30s and re-initiates matching. Rider's app polls GET /trips/{id} — sees REQUESTED status → retry matching."},{q:"How do you handle a driver who accepts but then goes offline?",a:"Driver heartbeat via WebSocket. If no heartbeat for 30s → mark driver offline (Redis HSET driver:{id} status offline, ZREM drivers:available). For an active trip: trip moves to DRIVER_OFFLINE_RETRY status. Retry matching with the next-closest driver (already ranked during initial matching). Rider notified with updated ETA."}]},

hld:`Client Request
  │
  ▼
API Gateway (middleware, runs on every request)
  │
  ├─ Step 1: Extract key (user_id + endpoint)
  │          (from JWT token, API key, or IP)
  │
  ├─ Step 2: Load rule (in-process cache, no DB hit)
  │
  ├─ Step 3: Redis Lua script (ATOMIC):
  │    ┌──────────────────────────────────────────┐
  │    │ local key = "rl:"..user..";"..endpoint   │
  │    │ local count = redis.call("INCR", key)     │
  │    │ if count == 1 then                        │
  │    │   redis.call("EXPIRE", key, window_secs)  │
  │    │ end                                       │
  │    │ if count > limit then return 0 end        │
  │    │ return count                              │
  │    └──────────────────────────────────────────┘
  │
  ├─ ALLOWED (count ≤ limit):
  │    Forward request to backend service
  │    Add headers: X-RateLimit-Limit: 100
  │                 X-RateLimit-Remaining: 13
  │                 X-RateLimit-Reset: 1705315260
  │
  └─ DENIED (count > limit):
       Return 429 Too Many Requests
       Headers: Retry-After: 47 (seconds until reset)
                X-RateLimit-Limit: 100
                X-RateLimit-Remaining: 0`,

deep:[{name:"Algorithms: Fixed vs Sliding Window vs Token Bucket",diag:`FIXED WINDOW COUNTER (simplest):
  Window: 9:00-9:01 → count resets at 9:01
  Problem: burst at boundary
    User sends 100 req at 9:00:59 → allowed
    User sends 100 req at 9:01:00 → allowed  
    → 200 requests in 1 second! (2× the limit)

SLIDING WINDOW LOG (most accurate):
  Redis Sorted Set: ZADD rl:{key} {now_ms} {uuid}
  ZREMRANGEBYSCORE rl:{key} 0 {now_ms - 60000}
  count = ZCARD rl:{key}
  Memory: stores every request timestamp (expensive)

SLIDING WINDOW COUNTER (best balance):
  Use two fixed windows: current + previous
  estimated_count = prev_count × (1 - elapsed/window) + curr_count
  → Approximates sliding window without storing all timestamps
  → Error: ≤ 0.003% in practice (proven mathematically)

TOKEN BUCKET (allows bursts):
  Bucket: capacity=100, refill_rate=100/min
  On request: if tokens>0 → consume 1 token → allow
  Refill: add tokens at rate even between requests
  → Allows burst of 100 instantly, then 100/min steady`,pts:["Use Sliding Window Counter for balanced accuracy + memory","Use Token Bucket when bursts are acceptable (API SDKs that batch)","Lua scripts ensure atomicity — all operations in one Redis command","Fixed Window is fine for most practical purposes despite boundary issue"]},{name:"Distributed Rate Limiting Accuracy",diag:`Problem: 3 API servers, global limit 100/min
  Each server has local Redis counter
  User routes to all 3 servers → can make 300 requests!

Solutions:
1. CENTRAL REDIS (most accurate):
   All servers share one Redis cluster
   → Adds ~0.5ms cross-DC latency if Redis not co-located
   → Recommended for strict rate limits (payment, auth)

2. LOCAL + SYNC (approximate):
   Each server: local limit = global_limit / server_count (=33)
   Every 10s: sync deltas to central store
   → Error window: max 10s of drift per server
   → Acceptable for search, recommendations

3. API GATEWAY LAYER (simplest):
   Rate limiting done at LB/gateway before reaching services
   Single point → no distributed coordination needed
   → Use this for most cases!`,pts:["Central Redis is simplest for accuracy — don't over-engineer","API Gateway layer (Kong, Nginx) has built-in rate limiting","Only use distributed sync if gateway is truly unavailable","Fail-open: if Redis unreachable → allow request + alert"]}],
xq:[{q:"Why use Lua scripts instead of Redis WATCH/MULTI/EXEC?",a:"Lua scripts execute atomically as a single Redis command — nothing can interrupt between the INCR and EXPIRE. With MULTI/EXEC (optimistic locking), if another client modifies the key between WATCH and EXEC, the transaction retries. Under high concurrent load, this retry loop degrades performance. Lua is simpler and always succeeds atomically."},{q:"How does the system handle rate limiting in multiple data centers?",a:"Option 1: Central Redis cluster (recommended) — all DCs hit the same Redis. Adds 1-5ms latency depending on DC distance. Fine for per-minute limits. Option 2: Local limits — set each DC's limit = global_limit / DC_count. Simple, low latency, but allows up to N× global limit if user routes to all DCs. Practical choice: central Redis for payment/auth APIs, local for search/recommendations.",pb:true},{q:"What if Redis goes down?",a:"Fail open: allow all requests when rate limiter is unavailable. This prevents a Redis outage from causing a cascading service outage. In-process fallback: a simple per-instance counter as a backstop against extreme abuse during Redis downtime. Alert on-call immediately. Redis Sentinel provides automatic failover in <30s for HA."},{q:"How do you rate limit at multiple granularities (per second AND per hour)?",a:"Run multiple Lua checks in a Redis pipeline: check 10/sec AND 100/min AND 1000/hour. All must pass for the request to proceed. Use separate keys per granularity: rl:sec:{user}:{endpoint}:{second_epoch}, rl:min:{user}:{endpoint}:{minute_epoch}. Pipeline the 3 checks as one round-trip to Redis — minimal latency impact."}]},

deep:[{name:"Inverted Index: How It Achieves < 200ms",diag:`Query: "system design interview"

Step 1: Tokenize + stem
  "system" "design" "interview"

Step 2: Fan-out to index shards (parallel, ~50ms)
  Shard for "system" → posting list:
    [(doc_1, tf=0.8), (doc_5, tf=0.3), ...]
  Shard for "design" → posting list:
    [(doc_1, tf=0.5), (doc_9, tf=0.7), ...]
  Shard for "interview" → posting list:
    [(doc_1, tf=0.9), (doc_3, tf=0.4), ...]

Step 3: Intersect posting lists (sorted merge, O(N)):
  Common docs: [doc_1, ...] → candidates

Step 4: Score each candidate:
  score = TF-IDF × PageRank × recency × position
  (title match > body match > anchor text match)

Step 5: Return top-10 to user in < 200ms total`,pts:["Fan-out to all shards in parallel → total latency = slowest shard, not sum","Posting lists stored sorted by doc_id → merge is O(N+M) not O(N×M)","Top-K selection per shard: each shard returns its best 100 → merge node picks global top-10","Shards served from RAM (OS page cache) → index lookups in microseconds"]},{name:"Bloom Filter for URL Deduplication",diag:`10B URLs × 10 bits at 1% FPR = ~12.5 GB Bloom filter
  (vs 10B URLs × 50B exact hash = 500 GB)

How it works:
  Add URL: hash(url) with K=7 hash functions
    Set bits at positions h1(url), h2(url)...h7(url)

  Check URL: compute same 7 positions
    ANY bit = 0 → URL definitely NOT seen → crawl it
    ALL bits = 1 → URL probably seen → skip
    (1% false positive → 1% of already-crawled pages re-crawled)

Distributed Bloom filter:
  Too large for one machine (12.5 GB)
  → Partition by URL prefix across 100 machines
  → Each machine: 125 MB Bloom filter
  → URL check: hash URL → route to correct machine → check`,pts:["Bloom filter eliminates ~99% of duplicate URL checks before any DB query","1% false positive = 1% wasted crawl (acceptable) — zero false negatives","URL still validated with exact DB check if Bloom filter says 'probably seen'","Rebuilt weekly from scratch to remove stale entries (can't remove from Bloom filter)"]}],
xq:[{q:"How do you index 10B pages in a reasonable time?",a:"Parallel crawling: 10,000 fetcher machines each crawl different URL ranges. Politeness delay (max 1 req/s per domain) limits per-domain rate. Priority queue gives more bandwidth to high-PageRank domains. Incremental indexing: only re-crawl pages that changed (HTTP ETag/Last-Modified). At 11,600 pages/sec distributed across 10K crawlers = 1.16 pages/sec per crawler."},{q:"How does PageRank work at scale?",a:"PageRank is an iterative algorithm: PR(A) = (1-d) + d × sum(PR(T)/L(T)) for all T linking to A. Computed with Spark on the full link graph weekly. Billions of nodes × thousands of iterations. Approximate convergence in 20-50 iterations. Stored per URL in a key-value store. Used as one signal in the ranking formula alongside TF-IDF, freshness, click-through rate."},{q:"How do you handle near-duplicate web pages?",a:"Simhash: compute 64-bit fingerprint of page content. Pages with Hamming distance ≤3 between simhashes are near-duplicates. Check new pages against simhash store (Redis hash). Canonical URL: index only one version, link duplicates to it. This eliminates ~30% of web content that is near-duplicate (scraped content, pagination variants, print-friendly pages).",pb:true},{q:"How do you implement spell correction?",a:"N-gram language model trained on query log (billions of queries). For misspelled query: generate candidates via edit distance 1-2 operations. Rank candidates by: frequency in query log × language model probability. Return 'Did you mean: {corrected}' if top candidate is significantly more common. Also: phonetic similarity (Soundex) for names."},{q:"How do you ensure the index is fresh for breaking news?",a:"Freshness signals: HTTP headers (Last-Modified, ETag), sitemap.xml update timestamps, high-velocity incoming link growth. Priority queue: news sites and high-traffic pages recrawled hourly. New URLs submitted via Search Console (submit-url API) can be indexed within hours. Streaming indexing for top domains: crawler → Kafka → index update pipeline in near-real-time (not batch)."}]},

deep:[{name:"Deduplication Pattern",diag:`Every notification gets an idempotency key:
  idempotency_key = SHA-256(user_id + event_type + event_id)
  
  e.g., "order_shipped" event for order O123 to user U1:
  key = SHA-256("U1:order_shipped:O123")

Before queuing:
  SETNX idem:{key} "" EX 86400  → Redis atomic
  → NX = only set if Not eXists
  → EX 86400 = auto-expire after 24h

  If SETNX returns 0 → key exists → already sent → skip
  If SETNX returns 1 → new notification → proceed

Why this works:
  Even if calling service fires the same event 3 times
  (retry logic, duplicate webhook, etc.)
  Only first SETNX succeeds → only one notification sent
  24h window covers any reasonable retry scenario`,pts:["SETNX is atomic — concurrent requests can't both succeed","SHA-256 key = deterministic for same event → same key every time","24h TTL: longer than any reasonable retry window","DB UNIQUE constraint on idempotency_key is backup if Redis fails"]},{name:"Priority Handling & Peak Load",diag:`Notification priority tiers:
  CRITICAL: OTP, payment confirmation, security alert
    → separate Kafka topic: "notifs-critical"
    → dedicated worker pool (always scaled up)
    → target delivery: < 5 seconds
    → never shed load

  TRANSACTIONAL: order updates, shipping, booking
    → Kafka topic: "notifs-transactional"
    → auto-scaled workers
    → target delivery: < 30 seconds

  MARKETING: promotions, newsletters
    → Kafka topic: "notifs-marketing"
    → lowest priority, shed first on overload
    → target delivery: < 5 minutes

At 1M/min peak (major sale event):
  Kafka consumer lag grows for marketing tier
  Workers auto-scale on Kafka lag metric
  KEDA (Kubernetes Event Driven Autoscaling):
    HPA trigger: lag > 10,000 messages
  Marketing notifications may be delayed by minutes
  Critical notifications always delivered within 5s`,pts:["Separate Kafka topics per priority = independent scaling","Never let marketing load delay critical notifications (bulkhead)","Pre-scale workers before known events (flash sales, cricket match end)","Consumer lag monitoring: alert if critical topic lag > 1,000 msgs"]}],
xq:[{q:"How do you handle a provider outage (FCM down)?",a:"Circuit breaker pattern: if FCM error rate exceeds 50% in 60s → open circuit. Workers stop calling FCM, save failed notifications to retry queue. When FCM recovers → circuit closes → drain retry queue. Switch to backup provider (Firebase → APNs direct for iOS if possible, or fallback to SMS/email). Alert on-call with FCM status page link."},{q:"How do you implement scheduled notifications?",a:"Store notification with scheduled_at timestamp in DB. A Scheduler Service (similar to distributed job scheduler) scans for notifications WHERE scheduled_at <= NOW() + INTERVAL '60s' AND status='PENDING'. Publishes to Kafka at the right time. For precise scheduling (within 1s): Redis ZADD schedule_queue {unix_ts} {notif_id} → consumer watches for due items.",pb:true},{q:"How do you handle user timezone for quiet hours?",a:"Store user timezone in preferences (e.g., 'Asia/Kolkata'). On notification send: convert quiet hours from user's timezone to UTC for comparison. Example: quiet_start=22:00 IST = 16:30 UTC. If current UTC time is in quiet range → defer notification to quiet_end time. Use a scheduled queue to hold deferred notifications."},{q:"What's the difference between at-least-once and exactly-once here?",a:"At-least-once: Kafka guarantees message is processed, may be reprocessed on failure. Our idempotency key prevents double delivery even if worker processes same notification twice. Effectively exactly-once from the user's perspective. True exactly-once (Kafka transactional) adds complexity with minimal benefit — idempotency keys are simpler and sufficient."}]},

deep:[{name:"LRU Eviction: O(1) Implementation",diag:`LRU = Least Recently Used: evict the key not accessed most recently

Naive approach: scan all keys → find oldest accessed → O(N) slow

O(1) solution: HashMap + Doubly Linked List
  HashMap: key → pointer to node in linked list (O(1) lookup)
  DLL: head=most recent, tail=least recent (O(1) insert/remove)

GET(key):
  node = HashMap[key]              // O(1)
  Move node to DLL head            // O(1): 4 pointer updates
  Return node.value

SET(key, value):
  if key exists: update + move to head  // O(1)
  else if cache full: 
    evict = DLL.tail                    // O(1): get LRU
    delete HashMap[evict.key]           // O(1)
    DLL.removeTail()                    // O(1)
  DLL.insertHead(new node)             // O(1)
  HashMap[key] = new node              // O(1)

Redis approximation:
  Instead of exact LRU (expensive to maintain), Redis samples
  5 random keys and evicts the least recently used among them.
  Error < 1% in practice. Configurable: maxmemory-samples 10`,pts:["Exact LRU requires O(N) memory for timestamps per key","Approximated LRU (5-sample): 95%+ accuracy, much simpler","LFU (Least Frequently Used): better for skewed access (Zipf)","Use allkeys-lru for cache; volatile-lru if mixing cache + persistent data"]},{name:"Hot Key Problem & Solutions",diag:`Hot key: one key receiving 90% of all requests
  e.g., RELIANCE stock price: 10M users watching simultaneously
  Problem: Single Redis node overwhelmed

Solution 1: Local client-side cache (simplest)
  Each app server: tiny in-process LRU (100 hot keys)
  Cache: Map<key, {value, expire_at}>
  Check local cache before Redis
  TTL: 1-5 seconds (short to avoid stale data)
  → 100 app servers × 10M QPS shared → each server 100K/s
     most served from local cache → Redis sees tiny fraction

Solution 2: Key replication (for long TTL data)
  Store hot key as N copies: price:RELIANCE:shard:0..9
  On read: RANDOM.nextInt(10) → pick one shard
  On write: update all 10 copies (pipeline)
  → 10× throughput for reads

Solution 3: Read replicas
  Route hot key reads to replica set
  Primary for writes, 3+ replicas for reads
  → Linear read scaling`,pts:["Detect hot keys: monitor request rate per key in sliding window","Client-side cache: best for frequently read, rarely changed data","Key replication: best for data that doesn't change often","Never mix approaches — pick one based on consistency requirements"]}],
xq:[{q:"How does Redis achieve sub-millisecond latency?",a:"Three key reasons: (1) All data in RAM — RAM access is 100ns vs SSD 0.1ms. (2) Single-threaded event loop — no context switches, no mutex locks, one command runs to completion. (3) Non-blocking I/O via epoll — one thread manages thousands of connections without blocking. Together: 100K-1M ops/sec with <0.2ms P99."},{q:"What's the difference between Redis Cluster and Redis Sentinel?",a:"Sentinel: monitors master/replica pairs, does automatic failover if master fails. Doesn't handle data sharding — you manage that. Good for single-node or manually sharded setups. Cluster: built-in sharding (16,384 slots) + automatic failover + rebalancing. More complex but auto-scales. Use Sentinel for simple HA; Cluster when data exceeds single node RAM.",pb:true},{q:"How does consistent hashing work in Redis Cluster?",a:"16,384 slots assigned to nodes (roughly equally). Key maps to slot via CRC16(key) % 16384. Clients cache the slot-to-node mapping. On MOVED redirect: update local mapping. Adding a node: slots migrated from existing nodes (minimal data movement — only 1/N slots remapped). Removing node: slots migrated to others. Near-zero downtime resharding."},{q:"How do you handle cache stampede (thundering herd)?",a:"When a hot key expires: thousands of concurrent requests all miss cache → all try to fetch from DB → DB overwhelmed. Solutions: (1) Mutex lock: SETNX lock:{key} worker EX 10 → only one fetcher, others wait or get stale. (2) Probabilistic early expiry: before TTL, randomly early-expire for a small % → background refresh before stampede. (3) Stale-while-revalidate: return stale value immediately, refresh async."}]},

hld:`CATALOG (Read-Heavy):
  Client → CDN (product pages, 15min TTL)
         → Redis Cache (product details, 1h TTL)
         → MySQL read replicas (on cache miss)
         → Elasticsearch (search queries, facets)

SHOPPING CART:
  Client ↔ Cart Service ↔ Redis Hash
  cart:{user_id} = { product_id: {qty, price_snapshot} }
  TTL: 7 days (abandoned cart = expire)
  
CHECKOUT FLOW (ACID):
  Client → Order Service
  ┌──────────────────────────────────────────────────────┐
  │ BEGIN TRANSACTION [MySQL]                            │
  │   SELECT i.quantity-i.reserved AS avail             │
  │     FROM inventory i WHERE sku_id=? FOR UPDATE       │
  │   IF avail < qty → ROLLBACK → 422 Out of Stock      │
  │   UPDATE inventory SET reserved=reserved+qty         │
  │   INSERT orders (status=PENDING, idempotency_key=?) │
  │ COMMIT                                               │
  └──────────────────────────────────────────────────────┘
  → Call Payment Service (idempotency_key=order_id)
    SUCCESS: UPDATE inventory (deduct actual), order=CONFIRMED
    FAILURE: UPDATE inventory (release reserve), order=FAILED
  → Kafka "order-events" → Warehouse, Email, Analytics

FLASH SALE INVENTORY:
  Pre-load: SET flash:inv:{sku_id} {qty} (e.g., 1000)
  On each purchase attempt:
    DECR flash:inv:{sku_id}
    if result < 0: INCR back → return SOLD_OUT
    if result >= 0: proceed to ACID checkout above`,
hldWhy:[["MySQL","catalog/orders ACID; checkout joins prices×inventory×promo"],["Redis (atomic DECR)","hot SKU inventory at 200k+/s; flash-sale star"],["CDN","absorbs 1M QPS reads on hot product pages"],["Virtual queue","buffers flash-sale spike before inventory layer"],["Elasticsearch","faceted search; CDC mirror from MySQL (not source of truth)"],["Kafka","order events → email/inventory/analytics async"]],
deep:[{name:"Preventing Overselling: 3-Layer Defense",diag:`LAYER 1: Redis DECR (fast check, ~0.1ms)
  DECR flash:inv:{sku_id}
  if result < 0: INCR back, return "SOLD OUT"
  if result >= 0: user allowed to proceed

  Why Redis: atomic DECR handles 100K concurrent at 100K ops/s
  MySQL SELECT FOR UPDATE: too slow for 1,667/s burst

LAYER 2: MySQL ACID Transaction (definitive check)
  SELECT quantity-reserved AS avail FROM inventory WHERE sku_id=?
  FOR UPDATE;  ← row-level lock, blocks concurrent updates
  IF avail < qty → ROLLBACK
  UPDATE inventory SET reserved=reserved+qty

  Why both Redis AND MySQL?
  Redis: fast path, handles bursts
  MySQL: authoritative, handles edge cases (Redis crash, inconsistency)

LAYER 3: DB CONSTRAINT (final safety net)
  quantity SMALLINT NOT NULL CHECK (quantity >= 0)
  DB physically rejects quantity going negative
  Even if application logic has a bug → DB saves you`,pts:["Redis DECR: O(1) atomic, no locking needed","SELECT FOR UPDATE: row-level (not table-level) — only blocks same SKU","DB constraint: last resort, should never trigger in normal operation","Test regularly: chaos test to verify each layer works independently"]},{name:"Flash Sale Architecture",diag:`T-1 hour before sale:
  Admin: SET flash:inv:{sku_id} 1000  [pre-load inventory in Redis]
  CDN: pre-warm product page at all edge nodes
  Scale: auto-scale Order Service pods to 3× normal

At sale start (T=0):
  100,000 users simultaneously → API Gateway
  Rate limit: max 50 requests/sec per user
  
  Request flow for each user:
    1. Redis DECR flash:inv:{sku_id}    [~0.1ms, 100K/s capacity]
    2. If >= 0: push order to Kafka "flash-orders"
    3. Return: "Order placed! Confirming payment..."
    
  Kafka consumers (async):
    4. MySQL ACID checkout (SELECT FOR UPDATE)
    5. Payment processing
    6. Confirmation email

  Virtual queue (if needed):
    If >1000 users want 1000 items → queue with token
    ZADD flash:queue:{sku} {arrival_time} {user_id}
    Process ZPOPMIN in batches → 1 item per queue position`,pts:["Redis handles the concurrency spike; MySQL handles the accuracy","Kafka decouples the fast acceptance from the slow DB processing","Virtual queue gives users fair ordering without server overload","Always test flash sale flow with load test before actual event"]}],
xq:[{q:"How do you prevent overselling when 100K users checkout simultaneously?",a:"Three-layer defense: (1) Redis atomic DECR — if result < 0, INCR back and return sold-out. This handles the concurrency spike at 100K ops/s. (2) MySQL SELECT FOR UPDATE within ACID transaction — definitive check with row-level lock. (3) DB CHECK constraint (quantity >= 0) — physical database constraint prevents any bug from creating negative inventory."},{q:"How does cart reservation work to prevent 'false out of stock'?",a:"Inventory has both quantity (actual) and reserved (held in carts). Available = quantity - reserved. On 'Add to Cart': UPDATE SET reserved=reserved+1. If user doesn't checkout in 30 minutes: background job releases the reservation (reserved=reserved-1). At checkout: the SELECT FOR UPDATE check uses (quantity-reserved). Reserved inventory doesn't show as available to others.",pb:true},{q:"How do you handle payment failure after inventory was reserved?",a:"Saga pattern compensating transaction: if payment fails → release inventory reservation (UPDATE SET reserved=reserved-qty) → update order to FAILED → notify user. Idempotency key (order_id) prevents double payment charges on retry. All operations logged in append-only audit table for dispute resolution."},{q:"How does product search handle facets (filter by brand, price range)?",a:"Elasticsearch aggregations: alongside search results, compute bucket counts for each facet dimension (brand, price range, rating range). These are computed in the same Elasticsearch query — one round-trip. Result: 'Phones > Filter by Brand > Samsung (127), Apple (89), OnePlus (45)'. Updated asynchronously as products change via Kafka → Elasticsearch Sink connector."}]}

hld:`User types "sea..." (after 150ms debounce)
  │
  GET /autocomplete?q=sea
  │
  ▼
API Server (stateless, 50 servers)
  │
  ├─ Step 1: Check in-process BLOCKLIST  (<0.01ms)
  │            blocked? → return empty
  │
  ├─ Step 2: Check Redis prefix cache     (~1ms)
  │            GET ac:en:{prefix}
  │            HIT → return 5 suggestions immediately
  │
  ├─ Step 3: In-memory TRIE lookup        (~1ms)
  │            trie.get("sea").top5 → return suggestions
  │            + SET Redis cache EX 300
  │
  └─ Step 4 (rare): Query MySQL DB        (~5ms)
               if prefix not in trie (very long/unusual)
               → SELECT term FROM terms
                 WHERE term LIKE 'sea%' AND blocked=false
                 ORDER BY frequency_7d DESC LIMIT 5

TRIE REBUILD (every 10 min, zero downtime):
  Spark job → aggregate query logs → compute frequencies
  Trie Builder → serialize new trie → S3
  API servers poll S3 every 5 min → detect new version
  → Download → load into memory → atomic pointer swap
  Blue-green: old trie serves until new one ready`,

deep:[{name:"Trie Structure & Top-5 Pre-Caching",diag:`Without pre-cached top-5 (WRONG approach):
  User types "sea" → traverse to node 's'→'e'→'a'
  → DFS entire subtree to find all terms
  → Sort by frequency
  → Return top-5
  Problem: subtree under "a" has millions of nodes → too slow

With pre-cached top-5 (CORRECT):
  Each trie node stores: top5 = ["search","seattle","seal","seamen","season"]
  User types "sea" → traverse to node 'a'
  → Return node.top5 immediately  ← O(prefix_length), not O(subtree_size)

How top-5 is maintained during trie build:
  Build trie from scratch every 10 minutes
  For each node: top5 = merge of children's top5 sets + node's own term
    → Keep top-5 by frequency score
  O(N × K) where N=nodes, K=5 → linear build time`,pts:["Pre-computing top-5 at each node is the key insight","Trie build is O(N×K) — fast enough for 10-min refresh cycle","Shard trie by first 2 chars if > 1GB: 'se*' → Server A, 'sf*' → Server B","Client debounce: send request only if user pauses 150ms → 5× QPS reduction"]},{name:"Real-Time Trending Overlay",diag:`Problem: viral query appears (breaking news) — not in trie yet
  Trie rebuild takes 10 minutes → users see no suggestion for 10 min

Solution: Real-time trending layer on top of trie:
  Kafka consumer: on each search query
    ZINCRBY trending:en:5min {score} {normalized_term}
    EXPIRE trending:en:5min 310  (5min window + buffer)
  
  Every 60s: top-100 terms from trending set injected into
  Redis as high-priority suggestions with recency boost:
    SET ac:trending:en:{prefix} [results] EX 60
    (overwrites regular cache for matching prefixes)

Query path with trending:
  1. Check ac:trending:en:{prefix}  → if found, merge with trie results
  2. Regular trie lookup
  3. Merge: trending terms get +0.5 score boost
  4. Return top-5 combined

Result: trending terms surface within 60s of going viral`,pts:["Trending overlay = real-time fix without trie rebuild","60s lag between viral event and suggestion appearance","Trending terms capped at 100 — filters ephemeral noise","A/B test: some users see trending suggestions, measure CTR"]}],
xq:[{q:"How do you update the trie without downtime?",a:"Blue-green deployment. New trie built in background, serialized to S3. Each API server polls S3 every 5 minutes for new version. On detection: download trie file, deserialize into memory (parallel), atomic pointer swap (old trie → new trie — single pointer update, nanoseconds). Old trie dereferenced, GC'd. Zero downtime, zero locked requests."},{q:"How do you handle misspellings? (e.g., user types 'gogle')",a:"At the prefix level: compute Levenshtein distance 1 alternatives for the last 2 chars of the prefix. Check trie for those alternatives. If trie has suggestions for 'google' but not 'gogle' → return 'Did you mean: google?' above suggestions. N-gram model: 'go' + 'ogl' bigrams help identify likely corrections. Don't apply correction until prefix ≥ 4 chars (too ambiguous for short prefixes).",pb:true},{q:"How would you handle 580K QPS at peak?",a:"Client debounce (150ms) reduces to ~116K effective QPS. Redis serves 95%+ with <1ms latency. Each stateless API server handles 2,000+ QPS → 58 servers needed. Trie in-memory per server (no shared state) — no coordination overhead. Scale horizontally: add servers, each gets a copy of the trie from S3."}]},

hld:`ON DEVICE (Client):
  Microphone → 10 seconds of audio
  → Convert to mono, 22050 Hz
  → FFT (Short-Time Fourier Transform)
  → Spectrogram: time × frequency × amplitude
  → Peak Finder: find local maxima (strongest frequencies)
  → Hash pairs: for each anchor peak, pair with nearby peaks
    hash = SHA1(freq1 | freq2 | Δtime)[first 32 bits]
  → 5000 hashes generated locally
  → POST /recognize {hash_list[]}

SERVER SIDE (<3 seconds):
  Recognition Service
    │ Receive 5000 hashes
    │
    ├─ Batch Cassandra lookup (50 parallel batches of 100):
    │    SELECT song_id, time_offset WHERE hash IN (100 hashes)
    │    → Each returns [(song_id, offset), ...] including collisions
    │
    ├─ Collect ALL (hash, song_id, db_offset) results
    │
    ├─ VOTING / ALIGNMENT:
    │    For each (song_id, db_offset):
    │      Δt = db_offset - query_offset_for_this_hash
    │      votes[song_id][Δt_bin]++
    │
    │    Winner = song_id with most votes in same Δt_bin
    │    (true song has consistent Δt; collisions have random Δt)
    │    Threshold: need ≥ 20 consistent matches
    │
    └─ Return song metadata from MySQL/Redis cache`,
hldWhy:[["In-RAM hash index","200 lookups in <100ms; ~80GB across 50 shards"],["Constellation pairs","noise-robust; survives bar/car recordings"],["Time-offset voting","discriminates true match from random hash collisions"],["Append-only segments","new songs matchable within minutes of upload"],["Cassandra/Redis","fingerprint inverted index; RAM-hot, disk-durable"],["Why pairs not single peaks?","single peaks collide; pairs are 1000× more discriminating"]],
deep:[{name:"Why Hash Pairs (Not Single Peaks)?",diag:`Single peak hash: hash(frequency, time)
  Problem: time shifts when song plays from different point
  → absolute timestamps don't match

Hash pair: hash(f1, f2, Δt)
  f1 = anchor peak frequency
  f2 = target peak frequency
  Δt = time difference between anchor and target peaks

Why this is noise-robust:
  Background noise: shifts amplitude but NOT relative frequencies
  Volume change: doesn't affect relative frequencies
  Time position change: Δt is RELATIVE (f2_time - f1_time)
    → same value regardless of where in song we started
  
  Even with 30% of peaks corrupted by noise:
    Remaining 70% still generate correct hash pairs
    Voting aligns them to the same Δt → identifies song
    25+ consistent votes = high confidence match`,pts:["Amplitude-invariant: noise doesn't affect frequency peak positions","Time-invariant: Δt between peaks is the same at any song position","Scale-invariant: tempo changes are partially handled","The math: probability of random collision matching in same Δt_bin is ~1/N_bins → very low"]},{name:"Cassandra: Why It's Perfect Here",diag:`Access pattern: "give me all (song_id, offset) for hash=X"
  This is a pure partition key lookup: O(1) in Cassandra
  hash = partition key → all data for this hash on same node

5000 parallel lookups:
  batch these as 50 groups of 100 hashes each
  BATCH SELECT WHERE hash IN (h1, h2, ... h100)
  All 50 batches execute in parallel
  Total time: ~100ms for all 5000 hash lookups

Why not MySQL?
  5000 random reads × 5ms/read = 25 seconds (sequential)
  Even parallel: 5000 connections overwhelms MySQL
  Cassandra: LSM-Tree reads serve from bloom filter + SSTable
              Multiple partitions served from different nodes in parallel

Why not Redis?
  1.5 trillion fingerprints × 16 bytes = 24TB
  Redis stores data in RAM: 24TB of RAM is prohibitively expensive
  Cassandra: disk-based with smart caching → much cheaper`,pts:["Cassandra partition-key lookup: O(1) per hash, naturally parallelizable","Bloom filter per SSTable: Cassandra can skip most disk reads","120 nodes × 200K reads/s = 24M reads/s capacity","Alternative: DynamoDB (same partition-key model, managed, pricier)"]}],
xq:[{q:"What happens when two different songs produce the same hash?",a:"This is expected and by design! The 32-bit hash space has ~4B values for 1.5T fingerprints — there WILL be many collisions. A colliding song appears in the Cassandra results but has random Δt values → it gets few or zero consistent votes. The true song accumulates many votes with the same Δt. Threshold of 20+ consistent votes filters false matches. Collisions are noise in the voting system, not errors."},{q:"How do you add 1 million new songs per day without downtime?",a:"Song upload triggers Kafka → fingerprinting workers → INSERT into Cassandra. Cassandra is an AP system — new fingerprints are available for queries immediately after write. No index rebuild, no downtime. Workers auto-scale on Kafka lag. Fingerprinting is CPU-intensive (~30s per song) but easily parallelized. 1M songs/day = ~11.6 songs/sec fingerprinting throughput needed.",pb:true},{q:"How do you handle live radio / streaming identification?",a:"Send rolling 10-second windows every 5 seconds (overlapping). Client: maintain audio buffer, every 5s fingerprint the last 10s → POST. Server: same recognition pipeline. Result: song identified within 10-15 seconds of starting. For continuous monitoring (broadcast licensing): server-side ingestion of stream directly → fingerprinting every 5s → log all matches with timestamps."}]},

hld:`PHOTO UPLOAD:
  Client → Request pre-signed S3 URL (GET /upload-url)
  Client → Upload directly to S3 (no server bandwidth used)
  Client → POST /posts (triggers processing)
  
  S3 Event → Kafka "media-uploaded"
    → Media Workers: resize (thumb/feed/HD), video transcode
    → S3 "processed" bucket → CDN push
    → Cassandra: post metadata
    → Fan-Out Service (Kafka consumer):
        followers < 10K: ZADD user:feed:{follower_id} {ts} {post_id}
        followers ≥ 10K (celebrity): skip push → pull at read time

FEED READ:
  Client → Feed Service → merge:
    1. ZREVRANGE user:feed:{uid} 0 99  (pushed posts)
    2. Latest posts from followed celebrities (pulled, last 5 each)
    3. Hydrate post objects from post cache/DB
    4. ML ranking: affinity × recency × content score
    5. Return top-20

STORIES:
  Same upload pipeline → Cassandra (TTL=86400s) → auto-deleted
  Story tray order: unseen first → sorted by recency
  View tracking: PFADD story:viewers:{id} {user_id} [HyperLogLog]
  24h cleanup: Cassandra TTL handles it + S3 lifecycle rule`,
hldWhy:[["Hybrid fanout","push for normals, pull for celebs (Bieber problem)"],["Cassandra TTL=24h stories","natural expiry; massive write rate"],["S3 + CDN","media variants delivered worldwide at edge"],["Redis ZSet feed","per-user precomputed timeline; ZREVRANGE for page"],["ML candidate-gen + re-rank","Reels + Explore beyond chronological"],["Why 4 different stacks?","Feed, Stories, Reels, Explore have orthogonal access patterns"]],
deep:[{name:"Hybrid Fan-Out for Feed",diag:`PROBLEM: Instagram has Beyoncé (200M followers)
  Naïve push: 200M Redis ZADDs on every post → not feasible

HYBRID SOLUTION:
  Regular user (<10K followers) → PUSH:
    Fan-out worker: for each follower
      ZADD user:feed:{follower_id} {timestamp} {post_id}
    Fast reads — O(1) per user from Redis

  Celebrity (≥10K followers) → PULL at read time:
    On POST: store in celeb:posts:{user_id} ZSET (own timeline)
    On feed READ: for each celebrity the user follows
      ZREVRANGE celeb:posts:{celeb_id} 0 4 → last 5 posts
    Merge with pushed feed → re-sort → return top-20

  How to detect celebrity threshold?
    Check follower_count on post creation
    Re-classify: if account crosses 10K → future posts use pull
    Historical posts in existing feeds remain (no backfill needed)

Timeline cache design:
  Key: user:feed:{user_id}  (Redis Sorted Set)
  Score: post timestamp (Unix ms)
  Value: post_id
  Max size: 800 posts → ZREMRANGEBYRANK removes oldest beyond 800`,pts:["10K threshold is adjustable — tune based on Redis memory vs fan-out cost","Celebrities see their post 'appear' for others within 200ms (pull-based)","Fan-out workers are stateless, Kafka-driven — horizontal scale is easy","On unfollow: ZREM user:feed:{follower} {all posts by this user} — async"]},{name:"Stories: 24-Hour Precise Expiry",diag:`Why Cassandra for stories + Redis for active tracking?
  Cassandra: SET TTL on each row = 86400 seconds (24 hours from insert)
    → Cassandra auto-deletes row at exactly T+24h
    → No manual cleanup needed in Cassandra
  
  Redis: for active stories (< 24h old) fast access
    ZADD active_stories:{user_id} {expires_at_unix} {story_id}
    ZRANGEBYSCORE active_stories:{user_id} {now} +inf
    → Returns all not-yet-expired stories
    ZREMRANGEBYSCORE active_stories:{user_id} 0 {now}
    → Removes expired ones lazily
  
  S3 cleanup: S3 lifecycle rule
    Prefix: stories/ + tag: created_at
    Rule: delete objects with tag > 24 hours old
    → Background, no application code needed

  Story viewer count (HyperLogLog):
    PFADD story:viewers:{story_id} {viewer_user_id}
    PFCOUNT story:viewers:{story_id} → estimated unique viewers
    Memory: 12KB for any size audience (12KB vs 8GB for exact count)
    Error: ±0.81% — acceptable for "500K views" display`,pts:["Cassandra TTL = most elegant solution: zero application code for deletion","HyperLogLog: 700,000× more memory-efficient than Set for unique counting","Redis ZADD scored by expires_at: O(log N) insert, O(log N + M) range query","Never use a background job for expiry when the DB or cache can do it natively"]}],
xq:[{q:"How does the like count work at 500M DAU scale?",a:"At 500M DAU even 0.1% liking simultaneously = 500K writes/sec. We can't write to MySQL on every like. Solution: Redis INCR post:{id}:likes (atomic, 100K ops/sec trivially). Every 30 seconds: batch flush Redis counts to Cassandra. 'Did I like this post?' → Redis Set: SADD post:{id}:likers {user_id}, or a bitfield. MySQL receives only ~33 batch writes/sec instead of 500K."},{q:"How do you implement photo deduplication to save storage?",a:"On upload: compute pHash (perceptual hash) of each image after decode. Check Bloom filter (fast O(1) check if hash seen before). On Bloom hit: exact pHash comparison against stored originals in Redis. If identical (same image): point new post_id to existing S3 object — no duplicate upload. Different EXIF, same pixels = duplicate. Saves 10-20% storage in practice. Metadata (post_id, owner) is still unique per post.",pb:true},{q:"How do Reels (short video) work differently from photos?",a:"Same upload pipeline but transcoded to multiple HLS qualities for adaptive streaming (same as YouTube). Reels feed is ML-ranked globally (TikTok-style) not just follow-graph based. Pre-fetch next 3 Reels before user finishes current. Engagement signals (watch %, loops, shares) published to Kafka → ML training pipeline. 1-second HLS segments for fast start."}]},

hld:`BILLING ENGINE:
  Billing Scheduler (runs every hour):
    SELECT sub_id FROM subscriptions
    WHERE current_period_end <= NOW()
      AND status = 'ACTIVE'
    → publish to Kafka "billing-due"
  
  Billing Workers (consume Kafka):
    1. Lock: SETNX bill:{sub_id}:{period} worker_id EX 300
    2. Calculate amount (apply discounts, prorations)
    3. Tax via Avalara API (cached per jurisdiction)
    4. idempotency_key = SHA256(sub_id + period_start + attempt)
    5. Charge payment gateway with idempotency_key
    6a. SUCCESS: UPDATE period dates, INSERT invoice
    6b. FAILURE: schedule dunning retry

  Dunning (payment failure escalation):
    Attempt 1 (Day 0 fail): retry at Day 3
    Attempt 2 (Day 3 fail): retry at Day 7 + "payment failed" email
    Attempt 3 (Day 7 fail): retry at Day 14 + "please update card"
    Attempt 4 (Day 14 fail): retry at Day 21 + "final notice"
    All fail: status=CANCELLED, access restricted, data kept 30 days

  Churn Prediction (ML, daily Spark job):
    Features: login_freq_drop, usage_decline, support_tickets
    Model: XGBoost → churn_probability score
    Top 10% risk: trigger retention offer (20% off 3 months)
    Sent 7 days before renewal`,
